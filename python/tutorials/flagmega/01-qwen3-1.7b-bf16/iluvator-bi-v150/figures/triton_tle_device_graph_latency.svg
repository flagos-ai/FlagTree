<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img">
<title>Aligned device graph latency (lower is better)</title>
<desc>Complete Qwen3-1.7B BF16 model and identical graph argmax on one BI-V150. Both backends launch 16 CTAs with 1024 threads each. Medians of 45 samples. Fixed token and zero historical KV; separate from CLI and vLLM request timing.</desc>
