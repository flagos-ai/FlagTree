<text x="85.0" y="37.0" font-size="24" text-anchor="start">Aligned device graph latency (lower is better)</text>
<text x="85.0" y="64.0" font-size="14" text-anchor="start">BF16 / BI-V150 / batch 1 / 28 layers / 16 CTAs × 1024 threads / 2026-10-23</text>
<text x="85.0" y="89.0" font-size="14" text-anchor="start">Complete model + identical graph argmax; 3 alternating rounds × 15 samples per context.</text>
<text x="85.0" y="113.0" font-size="14" text-anchor="start">Fixed token, zero historical KV. Device timing; separate from CLI and vLLM request latency.</text>
