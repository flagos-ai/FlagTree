<text x="85" y="89" font-size="14">Decode intervals exclude the first output token; not end-to-end request latency.</text>
<text x="85" y="113" font-size="14">CLI: token-scan prefill; vLLM: batched prefill. BF16 outputs may differ; CLI terminal I/O excluded.</text>
