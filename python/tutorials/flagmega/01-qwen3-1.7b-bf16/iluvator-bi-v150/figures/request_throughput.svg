<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img">
<title>Request throughput incl. prefill (higher is better)</title>
<desc>Qwen3-1.7B BF16, one Iluvatar BI-V150, batch one. Bars are measured medians. CLI and vLLM runtime/prefill paths differ; decode latency is not an end-to-end speedup.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="sans-serif" fill="#243343">
<text x="85" y="37" font-size="24">Request throughput incl. prefill (higher is better)</text>
<text x="85" y="64" font-size="14">BF16 / BI-V150 / batch 1 / 64 output tokens / host-visible timing</text>
<text x="85" y="89" font-size="14">Output tokens / complete request time, including prefill; not inverse decode latency.</text>
<text x="85" y="113" font-size="14">CLI: compiled token-scan prefill. CLI terminal I/O excluded.</text>
