<text x="85" y="37" font-size="24">Decode throughput (higher is better)</text>
<text x="85" y="64" font-size="14">BF16 / BI-V150 / batch 1 / 64 output tokens / host-visible timing</text>
<text x="85" y="89" font-size="14">Median per-request decode tokens / decode time; excludes prefill and the first output token.</text>
<text x="85" y="113" font-size="14">CLI: compiled token-scan prefill. CLI terminal I/O excluded.</text>
