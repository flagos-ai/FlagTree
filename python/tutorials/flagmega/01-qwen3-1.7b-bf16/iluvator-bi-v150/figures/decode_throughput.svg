<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img">
<title>Decode throughput (higher is better)</title>
<desc>Qwen3-1.7B BF16, one BI-V150, batch one. Bars are measured medians. Each scenario starts at most 70°C; cooling before warmup is outside timing. CLI uses compiled token-scan prefill; vLLM uses batched prefill. Terminal I/O excluded.</desc>
