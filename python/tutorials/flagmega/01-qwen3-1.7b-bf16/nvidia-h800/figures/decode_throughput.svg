<text x="85" y="89" font-size="14">Median per-request decode tokens / decode time; excludes prefill and the first output token.</text>
<text x="85" y="113" font-size="14">CLI: compiled token-scan prefill. vLLM: batched prefill. Data collected in separate runs. CLI terminal I/O excluded.</text>
