<text x="85" y="64" font-size="14">BF16 / H800 / batch 1 / 64 output tokens / host-visible timing</text>
<text x="85" y="89" font-size="14">Decode intervals exclude the first output token; not end-to-end request latency.</text>
<text x="85" y="113" font-size="14">CLI: compiled token-scan prefill. vLLM: batched prefill. Data collected in separate runs. CLI terminal I/O excluded.</text>
