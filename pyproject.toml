[build-system]
requires = ["setuptools>=40.8.0", "cmake>=3.20,<=4.0.3", "ninja>=1.11.1", "pybind11>=2.13.1", "pybind11-stubgen>=0.16.1"]
build-backend = "setuptools.build_meta"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/python"
files = [
    "python/triton/knobs.py",
    "python/triton/runtime/build.py",
    "python/triton/runtime/driver.py",
    "python/triton/_utils.py",
    "python/test/unit/test_knobs.py",
    "python/test/unit/runtime/test_build.py",
    "python/test/unit/runtime/test_compilation_listener.py",
]
exclude = ["/build/"]
follow_imports = "silent"

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
disable_split_list_with_comment = true
each_dict_entry_on_separate_line=false
split_before_named_assigns = false
split_complex_comprehension = true

# We're incrementally switching from autopep8 to ruff.
[tool.autopep8]
aggressive = 1
ignore = "E501,E701,E731,W690,W503"
max_line_length = 88

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E701", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.pyright]
# Dev-only: scope to the tle package and resolve the compiled _C modules from
# the build tree (stubs generated at build time; see python/setup_tools/stubgen.py).
# "lib.current" is a stable symlink created by setup.py pointing to the
# platform/version-specific build dir (e.g. lib.linux-x86_64-cpython-312).
include = ["python/triton/experimental/tle"]
extraPaths = ["build/lib.current", "python"]
stubPath = "build/lib.current"
