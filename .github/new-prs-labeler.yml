# ==========================================
# 1. Core File Labels (CORE)
# Includes core framework code and specific
# third-party core libraries.
# ==========================================
CORE:
  - changed-files:
      - any-glob-to-any-file:
          - 'bin/**'
          - 'cmake/**'
          - 'include/**'
          - 'lib/**'
          - 'python/**'
          - 'scripts/**'
          - 'test/**'
          - 'unittest/**'
          - 'utils/**'
          - 'third_party/proton/**'
          - 'third_party/tle/**'
          - 'third_party/f2reduce/**'
          - 'CMakeLists.txt'
          - 'Makefile'
          - 'MANIFEST.in'
          - 'pyproject.toml'
          - 'setup.py'
          - '.github/actions/**'
          - '.github/workflows/code-format-check.yml'

# ==========================================
# 2. CI/CD Labels
# Applied if any file under .github/workflows
# or .github/actions is modified.
# ==========================================
CI/CD:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/actions/**'
          - '.github/workflows/**'
          - '.github/CODEOWNERS'
          - '.github/dependabot.yml'
          - '.github/new-prs-labeler.yml'
          - '.github/PULL_REQUEST_TEMPLATE.md'
          - 'packaging/**'

# ==========================================
# 3. Documentation Labels (DOC)
# Applied if the PR contains modifications to
# any of the following file types.
# ==========================================
DOC:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '**/*.rst'
          - '**/*.png'
          - '**/*.jpg'
          - '**/*.jpeg'
          - '**/*.gif'
          - '**/*.ico'
          - 'LICENSE'

# ==========================================
# 4. Git Configuration Labels (GIT)
# Applied if Git-related configuration files are modified.
# ==========================================
GIT:
  - changed-files:
      - any-glob-to-any-file:
          - '.clang-format'
          - '.dockerignore'
          - '.editorconfig'
          - '.gitattributes'
          - '.git-blame-ignore-revs'
          - '.gitignore'
          - '.pre-commit-config.yaml'

