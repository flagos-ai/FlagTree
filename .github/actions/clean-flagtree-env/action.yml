name: 'Clean FlagTree Environment'
description: 'Clean up any previous FlagTree installations to ensure a fresh build'

runs:
  using: 'composite'
  steps:
    - name: Clean environment
      shell: bash
      run: |
        set -x
        echo "Starting environment cleanup..."

        SITE_PACKAGES=$(python3 -c "import sysconfig; print(sysconfig.get_path('purelib'))")

        # 🛡️ Safety Check 1: Abort if SITE_PACKAGES is empty to prevent accidental deletion
        if [ -z "$SITE_PACKAGES" ]; then
          echo "Error: Failed to get SITE_PACKAGES path. Aborting cleanup to prevent accidental deletion."
          exit 1
        fi

        # 🛡️ Safety Check 2: Abort if SITE_PACKAGES is not a valid directory
        if [ ! -d "$SITE_PACKAGES" ]; then
          echo "Error: SITE_PACKAGES path '$SITE_PACKAGES' is not a valid directory. Aborting cleanup."
          exit 1
        fi

        # 🛡️ Safety Check 3: Abort if SITE_PACKAGES is exactly / or /root
        case "$SITE_PACKAGES" in
          /|/root)
            echo "Error: SITE_PACKAGES path '$SITE_PACKAGES' is a critical directory. Aborting cleanup to prevent disaster."
            exit 1
            ;;
        esac

        # 1. Attempt to gracefully uninstall via pip
        python3 -m pip uninstall -y flagtree --break-system-packages || true

        # 2. Remove temporary directories left by interrupted pip processes
        # Note: Quotes are strictly required to prevent word splitting if the path contains spaces,
        # and to ensure the tilde '~' is treated as a literal character rather than expanding to the home directory.
        rm -rf "$SITE_PACKAGES"/~* || true

        # 3. Force remove any remaining metadata and code directories
        rm -rf "$SITE_PACKAGES"/flagtree*dist-info || true
        rm -rf "$SITE_PACKAGES"/triton || true

        echo "Environment cleanup completed."
