name: 'Run FlagGems Test'
description: 'Run FlagGems tests and output results. Can be used for both baseline generation and PR testing.'

inputs:
  flaggems-path:
    description: 'Absolute path to FlagGems repository on the self-hosted runner'
    required: true
    default: '/root/flaggems_ci/FlagGems'
  gpus:
    description: 'Number of GPUs to use for testing'
    required: true
    default: '0'
  output-base-dir:
    description: 'Base directory for test outputs'
    required: true
    default: '/root/flaggems_ci/PR'
  output-subdir:
    description: 'Subdirectory name under output-base-dir. If empty, falls back to pr-number or run_id-timestamp'
    required: false
    default: ''
  pr-number:
    description: 'Pull Request number (used for output directory naming if output-subdir is empty)'
    required: false
    default: ''
  run-script:
    description: >-
      Test runner script. Defaults to the copy in the FlagTree checkout, which
      runs in place and is given --flaggems-path; the skip list is taken from
      the asset directory, so neither needs copying into the clone.
    required: false
    default: ''
  first-parameter-only:
    description: 'Pass --first-parameter-only to test runner'
    required: true
    default: 'true'
  pre-command:
    description: 'Multiline script to run before FlagGems tests (e.g. source env, set LD_LIBRARY_PATH)'
    required: false
    default: ''
  flaggems-tag:
    description: >-
      FlagGems release under test. Selects the asset directory
      .github/workflows/gems/<flaggems-tag>/ for conftest.py and skip_list.
    required: true
  backend:
    description: >-
      Backend name, used to pick skip_list/<backend>.yaml when it exists.
    required: true
  assets-dir:
    description: >-
      Directory holding the FlagGems CI assets, normally the checked-out
      .github/workflows/gems. Must be an absolute path: the test step runs
      with the FlagGems clone as its working directory, not the workspace.
    required: false
    default: ''

outputs:
  test-output-dir:
    description: 'Directory where test results were written'
    value: ${{ steps.run-tests.outputs.test-output-dir }}
  test-date:
    description: 'Date string (YYYY-MM-DD) when tests were run'
    value: ${{ steps.vars.outputs.test-date }}
  test-id:
    description: 'Identifier used for the output subdirectory'
    value: ${{ steps.vars.outputs.test-id }}

runs:
  using: "composite"
  steps:
    - name: Compute variables
      id: vars
      shell: bash
      run: |
        set -x
        # Get current date for downstream baseline lookup
        TEST_DATE=$(date +%Y-%m-%d)
        echo "test-date=$TEST_DATE" >> $GITHUB_OUTPUT

        # Determine output subdirectory identifier
        if [ -n "${{ inputs.output-subdir }}" ]; then
          TEST_ID="${{ inputs.output-subdir }}"
        elif [ -n "${{ inputs.pr-number }}" ]; then
          TEST_ID="${{ inputs.pr-number }}"
        else
          # Fallback: use run ID + timestamp for non-PR triggers
          TEST_ID="${{ github.run_id }}-$(date +%H%M%S)"
        fi
        echo "test-id=$TEST_ID" >> $GITHUB_OUTPUT

        # Construct full output path
        TEST_OUTPUT_DIR="${{ inputs.output-base-dir }}/${TEST_ID}"
        echo "test-output-dir=$TEST_OUTPUT_DIR" >> $GITHUB_OUTPUT

    - name: Run FlagGems Tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.flaggems-path }}
      env:
        PRE_COMMAND: ${{ inputs.pre-command }}
        FLAGGEMS_TAG: ${{ inputs.flaggems-tag }}
        BACKEND: ${{ inputs.backend }}
        ASSETS_DIR: ${{ inputs.assets-dir }}
        RUN_SCRIPT: ${{ inputs.run-script }}
      run: |
        set -x

        # Run user-provided pre-command if any (e.g. source env, set LD_LIBRARY_PATH)
        if [ -n "$PRE_COMMAND" ]; then
          echo "Running pre-command..."
          eval "$PRE_COMMAND"
        fi

        # Set PYTHONPATH to the FlagGems source directory so script can run without installing FlagGems
        export PYTHONPATH="${{ inputs.flaggems-path }}/src${PYTHONPATH:+:${PYTHONPATH}}"

        # FlagTree-side CI assets. Absolute paths throughout: this step's
        # working directory is the FlagGems clone, not the workspace.
        ASSETS="${ASSETS_DIR:-${GITHUB_WORKSPACE}/.github/workflows/gems}"
        VERSION_DIR="${ASSETS}/${FLAGGEMS_TAG}"

        if [[ ! -d "${VERSION_DIR}" ]]; then
          echo "::error::No CI assets for FlagGems tag '${FLAGGEMS_TAG}'."
          echo "Expected ${VERSION_DIR} to exist."
          echo "Add .github/workflows/gems/${FLAGGEMS_TAG}/ with conftest.py"
          echo "and skip_list/default.yaml before testing against this tag."
          exit 1
        fi

        # conftest.py must be installed into the clone: pytest only picks it up
        # from the tests directory. It is version-specific, and without it no
        # operator markers are collected, leaving a summary.json that looks
        # plausible but is incomplete.
        cp "${VERSION_DIR}/conftest.py" tests/conftest.py

        TEST_OUTPUT_DIR="${{ steps.vars.outputs.test-output-dir }}"
        rm -rf "$TEST_OUTPUT_DIR" || true
        mkdir -p "$TEST_OUTPUT_DIR"

        # skip_list: the default, then a backend override when one exists.
        # Written into the output dir, after it is recreated above, so the list
        # the run actually used is kept alongside its results.
        SKIP_FILE="${TEST_OUTPUT_DIR}/skip_list.yaml"
        cp "${VERSION_DIR}/skip_list/default.yaml" "${SKIP_FILE}"
        BACKEND_SKIP="${VERSION_DIR}/skip_list/${BACKEND}.yaml"
        if [[ -f "${BACKEND_SKIP}" ]]; then
          cp "${BACKEND_SKIP}" "${SKIP_FILE}"
          echo "Using backend skip list: ${BACKEND}.yaml"
        else
          echo "Using default skip list (no ${BACKEND}.yaml)"
        fi

        # Build test runner command. The script runs from the FlagTree
        # checkout, so it is told where FlagGems lives.
        RUN_SCRIPT="${RUN_SCRIPT:-${ASSETS}/ci/ci_run_tests.py}"
        CMD="python ${RUN_SCRIPT} --gpus ${{ inputs.gpus }} --output-dir $TEST_OUTPUT_DIR"
        CMD="$CMD --flaggems-path ${{ inputs.flaggems-path }}"

        if [ "${{ inputs.first-parameter-only }}" = "true" ]; then
          CMD="$CMD --first-parameter-only"
        fi

        if [ -f "${SKIP_FILE}" ]; then
          CMD="$CMD --skip-file ${SKIP_FILE}"
        fi

        echo "Running: $CMD"
        $CMD

        # Export output directory for downstream steps
        echo "test-output-dir=$TEST_OUTPUT_DIR" >> $GITHUB_OUTPUT
