name: 'Clean Cache if Labeled'
description: 'Check if PR has specific backend CleanCache label and clean cache if present'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  backend:
    description: 'The backend name to check for (e.g., mthreads)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check specific CleanCache label
      id: check
      uses: actions/github-script@v6
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const backend = '${{ inputs.backend }}';
          const expectedLabel = `CleanCache:${backend}`;

          if (context.eventName !== 'pull_request' && context.eventName !== 'pull_request_target') {
            console.log('ℹ️ Not a PR event, skipping label check');
            core.setOutput('has_clean_cache_label', 'false');
            return;
          }

          const prNumber = context.payload.pull_request.number;
          const { data: prData } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });

          const labels = prData.labels.map(label => label.name);
          console.log(`Current PR labels:`, labels.join(', ') || '(no labels)');

          const hasCleanCache = labels.includes(expectedLabel);
          console.log(`🔍 Has "${expectedLabel}" label:`, hasCleanCache ? '✅ YES' : '❌ NO');

          core.setOutput('has_clean_cache_label', hasCleanCache ? 'true' : 'false');

    - name: Clean cache if label present
      id: cleanup
      if: steps.check.outputs.has_clean_cache_label == 'true'
      shell: bash
      run: |
        echo "========================================="
        echo "🧹 Cleaning cache for ${{ inputs.backend }} backend."
        echo "========================================="

        echo "-> Cleaning cache..."
        # rm -rf ~/.triton/cache
        # rm -rf ~/.flaggems
        echo "-> Clean cache done"
