name: 'Report to Feishu Bitable'
description: >-
  Write flat JSON records to a Feishu Bitable table. Workflow-agnostic: any job
  that can produce a flat JSON object (or JSONL) can report through it, with
  each key mapped to the table field of the same name.

inputs:
  record:
    description: 'Path to a flat JSON object (or array of objects) to report'
    required: false
    default: ''
  jsonl:
    description: 'Path to a JSONL file, one flat JSON object per line'
    required: false
    default: ''
  table-name:
    description: 'Target data table name inside the Bitable document'
    required: true
  schema:
    description: >-
      Path to a table schema JSON. When set, the table is created or repaired
      before reporting, so a new field never needs to be added by hand.
    required: false
    default: ''
  dedup-field:
    description: >-
      Field to deduplicate on. A row whose value matches is updated in place
      instead of a duplicate being appended.
    required: false
    default: ''
  app-id:
    description: 'Feishu app id. Reporting is skipped when empty.'
    required: false
    default: ''
  app-secret:
    description: 'Feishu app secret. Reporting is skipped when empty.'
    required: false
    default: ''
  app-token:
    description: 'Bitable app token, the /base/<app_token> part of the URL'
    required: false
    default: ''
  strict:
    description: >-
      Fail the step when reporting fails. Leave false inside a PR gate: losing
      a dashboard row should not fail a PR.
    required: false
    default: 'false'
  python:
    description: 'Python interpreter to use'
    required: false
    default: 'python3'

outputs:
  reported:
    description: "'true' when records were written to the table"
    value: ${{ steps.report.outputs.reported }}

runs:
  using: 'composite'
  steps:
    - name: Report to Feishu
      id: report
      shell: bash
      env:
        # Secrets travel as env vars, never on the command line, since argv is
        # visible via `ps` on a shared self-hosted runner.
        FEISHU_APP_ID: ${{ inputs.app-id }}
        FEISHU_APP_SECRET: ${{ inputs.app-secret }}
        FEISHU_BITABLE_APP_TOKEN: ${{ inputs.app-token }}
        RECORD: ${{ inputs.record }}
        JSONL: ${{ inputs.jsonl }}
        TABLE_NAME: ${{ inputs.table-name }}
        SCHEMA: ${{ inputs.schema }}
        DEDUP_FIELD: ${{ inputs.dedup-field }}
        STRICT: ${{ inputs.strict }}
        PYTHON: ${{ inputs.python }}
      run: |
        set -uo pipefail

        echo "reported=false" >> "$GITHUB_OUTPUT"

        fail_or_skip() {
          # Honour strict mode, but default to letting the job continue.
          if [[ "${STRICT}" == "true" ]]; then
            echo "::error::$1"
            exit 1
          fi
          echo "::warning::$1"
          exit 0
        }

        if [[ -z "${RECORD}" && -z "${JSONL}" ]]; then
          fail_or_skip "report-feishu: one of 'record' or 'jsonl' is required"
        fi

        # Named separately from the API error an empty name would cause: when
        # the table name is computed upstream, an empty one means that step
        # did not run, not that the table is missing.
        if [[ -z "${TABLE_NAME}" ]]; then
          fail_or_skip "report-feishu: 'table-name' is empty. When it comes from another step, check that step ran."
        fi

        # There is a record to report but no credentials to report it with.
        # Warn rather than skip quietly: reporting that is wired up and then
        # silently does nothing is exactly the failure this message exists to
        # make visible. Still exit 0 -- a lost dashboard row must not fail a
        # PR.
        if [[ -z "${FEISHU_APP_ID}" || -z "${FEISHU_APP_SECRET}" ]]; then
          set_count=0
          for v in "${FEISHU_APP_ID}" "${FEISHU_APP_SECRET}" "${FEISHU_BITABLE_APP_TOKEN}"; do
            [[ -n "${v}" ]] && set_count=$(( set_count + 1 ))
          done

          if (( set_count > 0 )); then
            # Some arrived and some did not, so the wiring is right and the
            # secrets themselves are wrong. Worth a sharper message: this is
            # what a renamed or deleted secret looks like.
            echo "::warning::report-feishu: only ${set_count} of 3 credentials" \
                 "arrived. Check that FLAGTREE_FEISHU_APP_ID, _APP_SECRET and" \
                 "_BITABLE_APP_TOKEN all exist as repository secrets."
          else
            echo "::warning::report-feishu: no credentials available, nothing" \
                 "was reported. If this workflow is meant to report, check that" \
                 "the caller forwards FLAGTREE_FEISHU_APP_ID, _APP_SECRET and" \
                 "_BITABLE_APP_TOKEN, and that they exist as repository" \
                 "secrets (an organization secret of the same name is passed" \
                 "by \`secrets: inherit\` and can be used by mistake)."
          fi
          exit 0
        fi

        if [[ -z "${FEISHU_BITABLE_APP_TOKEN}" ]]; then
          fail_or_skip "report-feishu: 'app-token' is required when reporting"
        fi

        # Inputs may be absent when an earlier step failed; that is not an
        # error worth surfacing, there is simply nothing to report.
        for path in "${RECORD}" "${JSONL}"; do
          if [[ -n "${path}" && ! -f "${path}" ]]; then
            echo "Input '${path}' does not exist, nothing to report."
            exit 0
          fi
        done

        SCRIPTS="${GITHUB_ACTION_PATH}/scripts"

        # Proxy settings live on the runner, not in the repo
        if [[ -f ~/env.sh ]]; then
          # shellcheck disable=SC1090
          source ~/env.sh || true
        fi

        args=(--table-name "${TABLE_NAME}")
        [[ -n "${RECORD}" ]] && args+=(--record "${RECORD}")
        [[ -n "${JSONL}" ]] && args+=(--jsonl "${JSONL}")
        [[ -n "${DEDUP_FIELD}" ]] && args+=(--dedup-field "${DEDUP_FIELD}")
        [[ "${STRICT}" == "true" ]] && args+=(--strict)

        # Create or repair the table first, so a schema that grew a field does
        # not silently drop it on the way in.
        if [[ -n "${SCHEMA}" ]]; then
          if [[ -f "${SCHEMA}" ]]; then
            "${PYTHON}" "${SCRIPTS}/bootstrap_feishu_table.py" \
              --schema "${SCHEMA}" --table-name "${TABLE_NAME}" \
              || fail_or_skip "report-feishu: table bootstrap failed"
          else
            fail_or_skip "report-feishu: schema '${SCHEMA}' not found"
          fi
        fi

        "${PYTHON}" "${SCRIPTS}/report_feishu.py" "${args[@]}" \
          || fail_or_skip "report-feishu: reporting failed"

        echo "reported=true" >> "$GITHUB_OUTPUT"
