      id: checkout5
      if: steps.checkout4.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 6
    # ------------------------------------------------------------------
