    # ------------------------------------------------------------------
    # Attempt 30 (final attempt, no continue-on-error)
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 30, final)
      id: checkout30
      if: steps.checkout29.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 2
      continue-on-error: true

    # ------------------------------------------------------------------
    # Verify
    # ------------------------------------------------------------------
    - name: Verify checkout success
      shell: bash
      run: |
        if [ ! -d ".git" ]; then
          echo "🚨 FATAL: smart checkout failed after all attempts."
          exit 1
        fi
        echo "✅ Smart checkout completed successfully."
