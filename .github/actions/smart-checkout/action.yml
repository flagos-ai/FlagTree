      if: steps.checkout13.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 15
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 15)
      id: checkout15
      if: steps.checkout14.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 16
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 16)
      id: checkout16
      if: steps.checkout15.outcome == 'failure'
