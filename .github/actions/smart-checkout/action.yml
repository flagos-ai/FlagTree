name: 'Smart Checkout with Retry'
description: 'Attempts to checkout code with multiple retries. Each attempt has a 1-minute timeout so that slow checkouts fail fast and are retried immediately. No sleep between attempts.'

inputs:
  checkout_version:
    description: 'The version of actions/checkout to use'
    required: false
    default: 'v6'

runs:
  using: 'composite'
  steps:
    - name: Remove stale Git lock files
      shell: bash
      run: |
        find . -type f -name '*.lock' -delete || true

    # ------------------------------------------------------------------
    # Attempt 1
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 1)
      id: checkout1
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 2
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 2)
      id: checkout2
      if: steps.checkout1.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 3
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 3)
      id: checkout3
      if: steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 4
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 4)
      id: checkout4
      if: steps.checkout3.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 5
    # ------------------------------------------------------------------
