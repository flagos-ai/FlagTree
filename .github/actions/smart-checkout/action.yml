    # ------------------------------------------------------------------
    # Attempt 22
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 22)
      id: checkout22
      if: steps.checkout21.outcome == 'failure'
      uses: actions/checkout@v6
      with:
