name: 'Smart Checkout with Retry'
description: 'Attempts to checkout code with multiple retries and sleep intervals'
inputs:
  checkout_version:
    description: 'The version of actions/smart-checkout to use'
    required: false
    default: 'v6' 

runs:
  using: 'composite'
  steps:
    - name: Checkout code (attempt 1) - v5
      id: checkout1
      if: inputs.checkout_version == 'v5'
      uses: actions/checkout@v5
      continue-on-error: true

    - name: Checkout code (attempt 1) - v6
      id: checkout1
      if: inputs.checkout_version == 'v6'
      uses: actions/checkout@v6
      continue-on-error: true

    - name: Sleep before checkout2
      if: steps.checkout1.outcome == 'failure'
      shell: bash
      run: |
        echo "First checkout attempt failed. Sleeping for 120 seconds before retry..."
        sleep 120

    - name: Checkout code (attempt 2) - v5
      id: checkout2
      if: steps.checkout1.outcome == 'failure' && inputs.checkout_version == 'v5'
      uses: actions/checkout@v5
      continue-on-error: true

    - name: Checkout code (attempt 2) - v6
      id: checkout2
      if: steps.checkout1.outcome == 'failure' && inputs.checkout_version == 'v6'
      uses: actions/checkout@v6
      continue-on-error: true

    - name: Sleep before final checkout
      if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "Second checkout attempt failed. Sleeping for 180 seconds before retry..."
        sleep 180

    - name: Checkout code (final attempt) - v5
      if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure' && inputs.checkout_version == 'v5'
      uses: actions/checkout@v5

    - name: Checkout code (final attempt) - v6
      if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure' && inputs.checkout_version == 'v6'
      uses: actions/checkout@v6

    - name: Verify checkout success
      shell: bash
      if: success()
      run: echo "Checkout completed successfully"