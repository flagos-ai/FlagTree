      id: checkout6
      if: steps.checkout5.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 7
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 7)
      id: checkout7
      if: steps.checkout6.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 8
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 8)
      id: checkout8
      if: steps.checkout7.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 9
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 9)
      id: checkout9
      if: steps.checkout8.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 10
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 10)
      id: checkout10
      if: steps.checkout9.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      timeout-minutes: 1
      continue-on-error: true

    # ------------------------------------------------------------------
    # Attempt 11
    # ------------------------------------------------------------------
    - name: Checkout code (attempt 11)
      id: checkout11
      if: steps.checkout10.outcome == 'failure'
      uses: actions/checkout@v6
      with:
