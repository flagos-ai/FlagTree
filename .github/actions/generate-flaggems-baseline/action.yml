name: 'Generate FlagGems Baseline'
description: 'Generate FlagGems baseline by building FlagTree and FlagGems, then running tests'

inputs:
  flaggems-tag:
    description: 'FlagGems tag'
    required: true
    default: 'v5.3.5'
  flagtree-branch:
    description: 'FlagTree branch'
    required: true
    default: 'main'
  flaggems-ci-dir:
    description: 'FlagGems CI directory'
    required: true
    default: '/root/flaggems_ci'
  gpus:
    description: 'GPU devices to use'
    required: true
    default: '0'

outputs:
  baseline-date:
    description: 'Date of generated baseline'
    value: ${{ steps.set-date.outputs.date }}
  baseline-dir:
    description: 'Directory where baseline was saved'
    value: ${{ steps.run-test.outputs.test-output-dir }}

runs:
  using: "composite"
  steps:
    - name: Set current date
      id: set-date
      shell: bash
      run: |
        TODAY=$(date +%Y-%m-%d)
        echo "date=$TODAY" >> $GITHUB_OUTPUT
        echo "📅 Baseline date: $TODAY"

    - name: Clone FlagTree
      uses: flagos-ai/FlagTree/.github/actions/git-clone-retry@main
      with:
        repo-url: 'https://github.com/flagos-ai/FlagTree.git'
        ref: ${{ inputs.flagtree-branch }}
        clone-dir: ${{ inputs.flaggems-ci-dir }}

    - name: Cleanup FlagTree Environment
      uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

    - name: Build FlagTree
      shell: bash
      run: |
        set -x
        source ~/env-3.6.sh
        cd ${{ inputs.flaggems-ci-dir }}/FlagTree
        MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

    - name: Clone FlagGems
      uses: flagos-ai/FlagTree/.github/actions/git-clone-retry@main
      with:
        repo-url: 'https://github.com/flagos-ai/FlagGems.git'
        ref: ${{ inputs.flaggems-tag }}
        clone-dir: ${{ inputs.flaggems-ci-dir }}

    - name: Install FlagGems
      shell: bash
      run: |
        cd ${{ inputs.flaggems-ci-dir }}/FlagGems
        python3 -m pip uninstall -y flag_gems --break-system-packages || true
        pip install -v -e . --no-build-isolation --no-deps

    - name: Run FlagGems Test for Baseline
      id: run-test
      uses: flagos-ai/FlagTree/.github/actions/run-flaggems-test@main
      with:
        flaggems-path: ${{ inputs.flaggems-ci-dir }}/FlagGems
        gpus: ${{ inputs.gpus }}
        output-base-dir: ${{ inputs.flaggems-ci-dir }}/Baseline
        output-subdir: ${{ steps.set-date.outputs.date }}
        run-script: 'tools/ci/ci_run_tests.py'
        skip-file: 'tools/ci/skip_list.yaml'
        first-parameter-only: 'true'

    - name: Verify Baseline Generated
      id: check_flaggems_baseline
      uses: ./.github/actions/check-flaggems-baseline
      with:
        flaggems-ci-dir: ${{ inputs.flaggems-ci-dir }}
