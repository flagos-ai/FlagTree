name: Iluvatar3.6-Gems-Baseline

on:
  push:
    branches: ["main", "triton_v3.6.x"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Group by commit SHA for push events to allow parallel runs from different merges.
  # Fall back to run_id for other events (e.g., schedule) to ensure each run is independent.
  group: ${{ github.workflow }}-${{
    github.event_name == 'push' && github.event.head_commit.id ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  iluvatar36x:
    if: ${{ github.event_name == 'push' }}
    uses: flagos-ai/FlagTree/.github/workflows/template-gems-baseline.yml@main
    with:
      runner: iluvatar3.6
      backend: iluvatar
      gpu-env-var: CUDA_VISIBLE_DEVICES
      flaggems-tag: 'v5.3.5'
      flagtree-build-command: |-
        set -x
        export FLAGTREE_BACKEND=iluvatar
        export TRITON_OFFLINE_BUILD=1
        export TRITON_BUILD_PROTON=OFF
        export TRITON_ILU_BUILD_GLUON=OFF
        MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v
      flaggems-pre-command: |-
        source ~/env.sh
        export LD_LIBRARY_PATH=/usr/local/corex-4.5.0/lib64/:${LD_LIBRARY_PATH}

        if [[ "$(uname -m)" == "aarch64" ]]; then
          libgomp_path=$(find /usr/lib /usr/lib64 /lib /lib64 -type f -name 'libgomp.so*' 2>/dev/null | head -n 1)
          if [[ -n "$libgomp_path" ]]; then
            export LD_PRELOAD="$libgomp_path${LD_PRELOAD:+:$LD_PRELOAD}"
          fi
        fi
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
