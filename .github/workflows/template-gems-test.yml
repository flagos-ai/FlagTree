name: Template Gems-Test

on:
  workflow_call:
    inputs:
      runner:
        description: 'Self-hosted runner label, e.g. nvidia3.6'
        required: true
        type: string
      backend:
        description: 'Backend name, e.g. nvidia, mthreads, ppu'
        required: true
        type: string
      gpu-env-var:
        description: 'GPU device environment variable name'
        required: false
        type: string
        default: 'CUDA_VISIBLE_DEVICES'
      flaggems-tag:
        description: 'FlagGems repo tag to test against'
        required: true
        type: string
      flagtree-build-command:
        description: 'Multiline script to build and install FlagTree'
        required: true
        type: string
    secrets:
      github-token:
        required: true

env:
  FLAGGEMS_CI_DIR: '/root/flaggems_ci'
  GPU_ENV_VAR: ${{ inputs.gpu-env-var }}

jobs:
  # Job: run FlagGems test on PR
  gems-test:
    runs-on: ${{ inputs.runner }}
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup Environment
        id: setup
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E "^(http_proxy|https_proxy|all_proxy|no_proxy|${GPU_ENV_VAR})=" >> $GITHUB_ENV || true
          GPU_DEVICES="${!GPU_ENV_VAR:-0}"
          echo "gpus=$GPU_DEVICES" >> $GITHUB_OUTPUT

          FLAGGEMS_REPO_DIR="${FLAGGEMS_CI_DIR}/FlagGems/test_${GITHUB_RUN_ID}"
          BEST_DIR="${FLAGGEMS_CI_DIR}/Baseline/best_FlagGems_${{ inputs.flaggems-tag }}"
          echo "FLAGGEMS_REPO_DIR=$FLAGGEMS_REPO_DIR" >> $GITHUB_OUTPUT
          echo "best_dir=$BEST_DIR" >> $GITHUB_OUTPUT

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        if: success()
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: ${{ inputs.backend }}

      - name: Cleanup FlagTree Environment
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Build FlagTree
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          ${{ inputs.flagtree-build-command }}

      - name: Clone FlagGems Repo
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/git-clone-retry@main
        with:
          repo-url: 'https://github.com/flagos-ai/FlagGems.git'
          ref: ${{ inputs.flaggems-tag }}
          clone-dir: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}

      - name: Clear cache if ClearCache label present
        id: clear_cache
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.github-token }}
          backend: ${{ inputs.backend }}

      - name: Run FlagGems Test
        id: run-flaggems-test
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/run-flaggems-test@main
        with:
          flaggems-path: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          gpus: '${{ steps.setup.outputs.gpus }}'
          output-base-dir: '${{ env.FLAGGEMS_CI_DIR }}/PR'
          pr-number: '${{ github.event.pull_request.number }}'
          run-script: 'tools/ci/ci_run_tests.py'
          skip-file: 'tools/ci/skip_list.yaml'
          first-parameter-only: 'true'

      - name: Compare with Baseline
        id: compare-baseline
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/compare-flaggems-test@main
        with:
          baseline-dir: '${{ steps.setup.outputs.best_dir }}'
          candidate-dir: '${{ steps.run-flaggems-test.outputs.test-output-dir }}'
          compare-script: 'tools/ci/compare_test_result.py'
          working-directory: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          fail-on-missing-baseline: 'true'

      - name: Cleanup FlagGems Repo
        if: always()
        shell: bash
        env:
          REPO_DIR: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}
        run: |
          set -u

          if [[ -z "${REPO_DIR}" || "${REPO_DIR}" == "/" || "${REPO_DIR}" == "/root" || "${REPO_DIR}" == "/data" ]]; then
            echo "REPO_DIR is empty or unsafe (${REPO_DIR}), skip cleanup"
            exit 0
          fi

          for i in 1 2 3; do
            if rm -rf "${REPO_DIR}"; then
              echo "Cleanup succeeded on attempt $i"
              exit 0
            fi
            if [[ $i -lt 3 ]]; then
              echo "Cleanup attempt $i failed, retrying in 30s..."
              sleep 30
            fi
          done

          echo "::warning::Failed to remove ${REPO_DIR} after 3 attempts, dumping contents"
          ls -la "${REPO_DIR}" 2>/dev/null | head -50 || true
          exit 0
