# Skip operators that cause GPU state corruption
skip_operators:
  - alias_copy
  - alias_copy_out
  - min
  - min_dim
  - nll_loss2d_backward
  - nll_loss2d_forward
  - nll_loss_backward
  - nll_loss_forward
  - nll_loss_nd_backward
  - nll_loss_nd_forward
  - softmax
  - softmax_backward
  - softmax_backward_data
  - softmax_backward_out
  - softmax_out
# Skip specific test functions
skip_test_patterns:
  #- test_example_pattern

# Skip entire test files
skip_test_files:
  #- test_example.py
