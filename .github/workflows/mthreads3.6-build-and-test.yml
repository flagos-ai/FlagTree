name: Mthreads3.6-Build-And-Test

on:
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mthreads36x-unit-test:
    runs-on: mthreads3.6
    if: ${{ github.repository == 'FlagTree/flagtree' || github.repository == 'flagos-ai/flagtree' }}

    # Add permissions to read PR information (required for fetching labels)
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: mthreads

      - name: Build FlagTree
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          export FLAGTREE_BACKEND=mthreads
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation

      - name: Clean cache if CleanCache label present
        id: clean_cache
        uses: ./.github/actions/clean-cache-if-labeled
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit Test
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          python3 -m pytest -s third_party/mthreads/python/test/unit --device musa
          # TLE tutorials unit tests
          python3 python/tutorials/tle/01-fft.py --only_unit_test
          python3 python/tutorials/tle/03-topk.py --only_unit_test
