name: Iluvatar3.6-Gems-Test

on:
  pull_request:
    branches: ["main", "triton_v3.6.x"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Group by PR number for pull_request events to cancel outdated runs from the same PR.
  # Fall back to run_id for other events (e.g., schedule) to ensure each run is independent.
  group: ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  iluvatar36x:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    uses: flagos-ai/FlagTree/.github/workflows/template-gems-test.yml@main
    with:
      runner: iluvatar3.6
      backend: iluvatar
      gpu-env-var: CUDA_VISIBLE_DEVICES
      flaggems-tag: 'v5.3.5'
      flagtree-build-command: |-
        # FlagPrism: offline Iluvatar builds must receive the nlohmann/json
        # root explicitly; the root contains include/nlohmann/json.hpp.
        source ~/env.sh
        set -x
        if [[ -z "${JSON_SYSPATH:-}" ]]; then
          for json_root in /usr /usr/local "$HOME/.triton/json" /opt/deps/json; do
            if [[ -f "$json_root/include/nlohmann/json.hpp" ]]; then
              export JSON_SYSPATH="$json_root"
              break
            fi
          done
        fi
        if [[ -z "${JSON_SYSPATH:-}" ]] ||
           [[ ! -f "$JSON_SYSPATH/include/nlohmann/json.hpp" ]]; then
          echo "::error::FlagPrism: JSON_SYSPATH must point to a directory containing include/nlohmann/json.hpp"
          exit 1
        fi
        export FLAGTREE_BACKEND=iluvatar
        export TRITON_OFFLINE_BUILD=1
        export TRITON_BUILD_PROTON=OFF
        export TRITON_ILU_BUILD_GLUON=OFF
        MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v
      flaggems-pre-command: |-
        source ~/env.sh
        export LD_LIBRARY_PATH=/usr/local/corex-4.5.0/lib64/:${LD_LIBRARY_PATH}

        if [[ "$(uname -m)" == "aarch64" ]]; then
          libgomp_path=$(find /usr/lib /usr/lib64 /lib /lib64 -type f -name 'libgomp.so*' 2>/dev/null | head -n 1)
          if [[ -n "$libgomp_path" ]]; then
            export LD_PRELOAD="$libgomp_path${LD_PRELOAD:+:$LD_PRELOAD}"
          fi
        fi
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
