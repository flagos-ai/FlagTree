# Tell the author of a change, in Feishu, that their CI failed.
#
# Centralised rather than a step in each workflow: one implementation covers
# every workflow listed below, and adding a backend's CI means adding a line
# here instead of editing its workflow. Same shape as auto-rerun.yml, which
# watches the same set for a different reason.
#
# Quiet by design. A failure notifies nobody unless the author has a row in
# the ci_contacts Bitable, so this can be rolled out one person at a time, and
# a workflow listed in ci_notify_skip stays silent while it is known broken.
#
# Reruns DO notify again. GitHub fires workflow_run once per attempt, so a
# rerun that fails again is a new event and a new message -- which is what the
# author needs, since they usually reran precisely to see whether it sticks.

name: Notify-PR-Owner

on:
  workflow_run:
    types: [completed]
    workflows:
      - "Amd3.6-Build-And-Test"
      - "Amd3.6-Gems-Baseline"
      - "Amd3.6-Gems-Test"
      - "Enflame3.6-GCU300-Build-And-Test"
      - "Enflame3.6-GCU300-Gems-Baseline"
      - "Enflame3.6-GCU300-Gems-Test"
      - "Enflame3.6-GCU400-Build-And-Test"
      - "Enflame3.6-Qwen-Benchmark"
      - "FlagCICD-NV3.6-Build-And-Test"
      - "Hcu3.6"
      - "Hcu3.6-Gems-Baseline"
      - "Hcu3.6-Gems-Test"
      - "Hcu3.6-Qwen-Benchmark"
      - "Hcu3.6-Dist"
      - "Iluvatar3.6-Build-And-Test"
      - "Iluvatar3.6-Gems-Baseline"
      - "Iluvatar3.6-Gems-Test"
      - "Iluvatar3.6-Qwen-Benchmark"
      - "Iluvatar3.6-TLE-Build-And-Test"
      - "Metax3.6-Build-And-Test"
      - "Metax3.6-Gems-Baseline"
      - "Metax3.6-Gems-Test"
      - "Metax3.6-Qwen-Benchmark"
      - "Mthreads3.6-Build-And-Test"
      - "Mthreads3.6-Gems-Baseline"
      - "Mthreads3.6-Gems-Test"
      - "Mthreads3.6-Qwen-Benchmark"
      - "Nvidia3.6-Build-And-Test"
      - "Nvidia3.6-Gems-Baseline"
      - "Nvidia3.6-Gems-Test"
      - "Nvidia3.6-Qwen-Benchmark"
      - "Nvidia3.6-Single-Dist-Test"
      - "Ppu3.6-Build-And-Test"
      - "Ppu3.6-Core-Build-And-Test"
      - "Ppu3.6-Gems-Baseline"
      - "Ppu3.6-Gems-Test"
      - "Ppu3.6-Qwen-Benchmark"
      - "Rpu3.6-Build-And-Test"
      - "Spacemit3.6-Build-And-Test"
      - "Sunrise3.6-Build-And-Test"
      - "Thrive3.6-Build-And-Test"
      - "TileIR3.6-Build-And-Test"
      - "Tsingmicro3.6-Build-And-Test"
      - "Tsingmicro3.6-Gems-Baseline"
      - "Tsingmicro3.6-Gems-Test"
      - "Xpu3.6-Build-And-Test"
      - "Xpu3.6-Gems-Baseline"
      - "Xpu3.6-Gems-Test"
      - "Xpu3.6-Qwen-Benchmark"

# Name each run after the run it is reporting on, so the Actions list shows
# what failed rather than rows of identical titles.
run-name: >-
  Notify [${{ github.event.workflow_run.name }}]
  ${{ github.event.workflow_run.event == 'pull_request'
  && format('PR #{0}', github.event.workflow_run.pull_requests[0].number || '?')
  || format('{0} {1}', github.event.workflow_run.event, github.event.workflow_run.head_branch) }}:
  ${{ github.event.workflow_run.display_title }}

permissions:
  actions: read        # read the watched run's current state
  contents: read
  pull-requests: read  # resolve the PR author

concurrency:
  # One per watched run attempt: a re-delivered event must not send twice,
  # while a genuine rerun is a different attempt and gets its own message.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait out the auto-rerun watchdog
        id: settled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          REPO=${{ github.repository }}

          # auto-rerun.yml reruns known-transient failures. Telling the author
          # about a failure that is about to be retried, and often succeeds, is
          # the fastest way to make these messages ignorable. Rather than
          # duplicating its pattern list -- two copies would drift -- wait and
          # then look at what actually happened to the run.
          echo "Giving the rerun watchdog time to act..."
          sleep 180

          STATUS=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status' 2>/dev/null || echo "")
          ATTEMPT=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.run_attempt' 2>/dev/null || echo "")
          echo "Run $RUN_ID is now status='$STATUS' attempt='$ATTEMPT' (was attempt ${{ github.event.workflow_run.run_attempt }})"

          # Picked up for a rerun: the next attempt fires its own completed
          # event, so that one decides whether to notify.
          if [[ "$STATUS" != "completed" ]]; then
            echo "Being rerun, leaving it to the next attempt."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$ATTEMPT" && "$ATTEMPT" != "${{ github.event.workflow_run.run_attempt }}" ]]; then
            echo "Already on attempt $ATTEMPT, this event is stale."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Identify who to tell
        id: author
        if: steps.settled.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO=${{ github.repository }}
          SHA=${{ github.event.workflow_run.head_sha }}
          EVENT=${{ github.event.workflow_run.event }}
          ACTOR='${{ github.event.workflow_run.actor.login }}'

          LOGIN=""
          PR_NUMBER=""
          PR_URL=""
          TELL=""

          # A scheduled run executes whatever is at the head of the branch,
          # so the commit it lands on resolves to the last PR merged -- an
          # author who had nothing to do with the failure, and who would keep
          # being paged until somebody else merged something. It belongs to
          # whoever looks after CI instead, which is a standing list rather
          # than anything derivable from the run.
          if [[ "$EVENT" == "schedule" ]]; then
            echo "Scheduled run: notifying the admins rather than an author."
            {
              echo "logins="
              echo "admins=true"
              echo "pr-number="
              echo "pr-url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run has an obvious owner: whoever started it. No standing
          # list needed, and no reason to tell anyone else.
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "Manual run started by ${ACTOR:-<unknown>}."
            {
              echo "logins=$ACTOR"
              echo "admins=false"
              echo "pr-number="
              echo "pr-url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything else without a change behind it has nobody to tell.
          if [[ "$EVENT" != "pull_request" && "$EVENT" != "push" ]]; then
            echo "Trigger is '$EVENT', which belongs to nobody. Not notifying."
            {
              echo "logins="
              echo "admins=false"
              echo "pr-number="
              echo "pr-url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Asked for a push too, not just pull_request: a merge arrives as a
          # push whose actor is the maintainer who pressed the button, and the
          # commit still belongs to the PR it came from. Squash merges also
          # record `GitHub` as the committer, so the commit itself does not say
          # who wrote the change -- the PR does.
          # workflow_run.pull_requests[] is empty for fork PRs, hence the API
          # call rather than trusting that field.
          # `first` yields null rather than failing when a commit belongs to
          # no PR, which is the normal case for a direct push.
          PR_FIELDS=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq 'first(.[] | "\(.user.login) \(.number) \(.html_url)") // ""' 2>/dev/null || echo "")
          read -r LOGIN PR_NUMBER PR_URL <<<"${PR_FIELDS}"

          [[ -n "$LOGIN" ]] && TELL="$LOGIN"

          # The maintainer who merged it also wants to know, since they are the
          # one who just changed the branch. Skipped when they are the author,
          # so self-merging does not arrive twice.
          if [[ "$EVENT" == "push" && -n "$ACTOR" && "$ACTOR" != "$LOGIN" ]]; then
            TELL="${TELL:+$TELL }$ACTOR"
          fi

          {
            echo "logins=$TELL"
            echo "admins=false"
            echo "pr-number=$PR_NUMBER"
            echo "pr-url=$PR_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Author: ${LOGIN:-<none>} Actor: ${ACTOR:-<none>} PR: ${PR_NUMBER:-none}"
          echo "Will tell: ${TELL:-<nobody>}"

      - name: Resolve the Feishu recipient
        id: contact
        if: ${{ steps.settled.outputs.proceed == 'true' && (steps.author.outputs.logins != '' || steps.author.outputs.admins == 'true') }}
        continue-on-error: true
        uses: flagos-ai/FlagTree/.github/actions/lookup-feishu-contact@main
        with:
          login: ${{ steps.author.outputs.logins }}
          admins: ${{ steps.author.outputs.admins }}
          workflow: ${{ github.event.workflow_run.name }}
          app-id: ${{ secrets.FLAGTREE_FEISHU_APP_ID }}
          app-secret: ${{ secrets.FLAGTREE_FEISHU_APP_SECRET }}
          app-token: ${{ secrets.FLAGTREE_FEISHU_BITABLE_APP_TOKEN }}

      - name: Collect what failed
        id: jobs
        if: ${{ steps.contact.outputs.open-ids != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          REPO=${{ github.repository }}

          # "job / step @ host" rather than the job alone: the job name is the
          # backend, which the title already says, while the step separates a
          # build break from a failing test, and the host matters because
          # several self-hosted runners share one label -- a failure on one
          # machine and not its siblings points at the machine. Steps the
          # runner skipped after the failure are ignored: only `failure`
          # counts, not `cancelled`. runner_name is absent on a queued or
          # cancelled job, so it is only appended when present.
          NAMES=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '
            [ .jobs[]
              | select(.conclusion == "failure")
              | . as $job
              | ( [ $job.steps[]? | select(.conclusion == "failure") | .name ] ) as $steps
              | ( if ($steps | length) > 0
                  then "\($job.name) / \($steps | join(" + "))"
                  else $job.name
                  end ) as $what
              | if ($job.runner_name // "") != ""
                then "\($what) @ \($job.runner_name)"
                else $what
                end
            ] | join("; ")' 2>/dev/null || echo "")

          # Keep the card readable: the run link carries the full detail.
          if [[ ${#NAMES} -gt 300 ]]; then
            NAMES="${NAMES:0:297}..."
          fi
          echo "failed=${NAMES:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Failed: ${NAMES:-unknown}"

      # One message per recipient rather than one shared card: a direct
      # message is read in the recipient's own chat with the bot, so there is
      # nothing to share. The ids are already de-duplicated by the lookup.
      - name: Notify them
        if: ${{ steps.contact.outputs.open-ids != '' }}
        continue-on-error: true
        uses: flagos-ai/FlagTree/.github/actions/notify-feishu@main
        with:
          open-id: ${{ steps.contact.outputs.open-ids }}
          title: "CI failed: ${{ github.event.workflow_run.name }}"
          color: orange
          text: |
            **${{ github.event.workflow_run.display_title }}**

            **Failed**
            ${{ steps.jobs.outputs.failed }}

            **Trigger** ${{ github.event.workflow_run.event }} on `${{ github.event.workflow_run.head_branch }}`${{ steps.author.outputs.pr-number != '' && format(' (PR #{0})', steps.author.outputs.pr-number) || '' }}
            **Attempt** ${{ github.event.workflow_run.run_attempt }}${{ steps.author.outputs.admins == 'true' && '

            _Sent to the CI admins: a scheduled run belongs to the branch, not to any one change._' || '' }}
          link-url: ${{ github.event.workflow_run.html_url }}
          link-text: Open run
          # Second button only when the change came from a PR. The run link
          # answers "what broke"; the PR link answers "how is the rest of my
          # CI doing", which is the next thing anyone asks.
          link2-url: ${{ steps.author.outputs.pr-url }}
          link2-text: Open PR
          app-id: ${{ secrets.FLAGTREE_FEISHU_APP_ID }}
          app-secret: ${{ secrets.FLAGTREE_FEISHU_APP_SECRET }}
