name: Build RPM Packages

# PRs trigger this only for packaging-file changes; source changes do
# not (the full wheel build is too heavy for a general PR gate).
# Release tags are unprefixed since 0.3.0, e.g. 0.6.0 / 0.6.0rc1.
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/backends.conf'
      - 'packaging/build-helpers/**'
      - 'packaging/rpm/**'
      - '.github/workflows/build-rpm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    # Skip backend-variant tags like 0.6.0+mthreads3.6.
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '+') }}
    # A row whose backend compiles the wheel from source builds the full
    # FlagTree LLVM/MLIR wheel; a row packaging a published wheel
    # (rpm_wheel=index in packaging/backends.conf) only downloads and
    # assembles, and finishes in minutes. The architecture comes from the
    # backend's row: an aarch64 package is built on a hosted arm64 runner,
    # which this public repository can use, so nothing here is emulated.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Original Fedora target — artifact name unchanged so
          # downstream collectors keep working.
          - target: fedora43
            backend: nvidia
            base_image: fedora:43
            runner: ubuntu-latest
            artifact: flagtree-nvidia-rpm-packages
          - target: openeuler2403
            backend: nvidia
            base_image: openeuler/openeuler:24.03-lts
            runner: ubuntu-latest
            artifact: flagtree-nvidia-oe2403-rpm-packages
          # First rpm row packaging a wheel this workflow does not build: the
          # ascend wheel is published by the backend's own delivery workflow
          # from vendor hardware as cp311 + linux_aarch64, which is what
          # openEuler 24.03 runs on aarch64. fetch-wheel.sh enforces both tags.
          - target: openeuler2403
            backend: ascend
            base_image: openeuler/openeuler:24.03-lts
            runner: ubuntu-24.04-arm
            artifact: flagtree-ascend-oe2403-rpm-packages
    steps:
      # The wheel build peaks near the runner's free-disk limit.
      # Ephemeral GitHub-hosted VMs only — never a self-hosted machine.
      - name: Free runner disk space
        run: |
          if [ "${RUNNER_ENVIRONMENT}" != "github-hosted" ]; then
            echo "Not a GitHub-hosted runner; skipping disk cleanup."
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build .rpm (${{ matrix.backend }} / ${{ matrix.target }})
        run: bash packaging/rpm/helpers/build-flagtree-rpm.sh ${{ matrix.backend }}
        env:
          RPM_BASE_IMAGE: ${{ matrix.base_image }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-rpm/output/*.rpm
          retention-days: 7
