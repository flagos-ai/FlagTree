name: Nvidia3.6-FlagMega

on:
  workflow_dispatch:
  schedule:
    - cron: '40 19 * * *'
  push:
    branches: ["main", "triton_v3.6.x"]
  pull_request:
    branches: ["main", "triton_v3.6.x"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number ||
    github.event_name == 'push' && github.event.head_commit.id ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  nv36x-flagmega-test:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> "$GITHUB_ENV" || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: nvidia

      - name: Detect Target Branch
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          echo "TARGET_BRANCH=${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build FlagTree with FlagMega
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          source ~/env-3.6.sh
          FLAGMEGA_VENV="$(mktemp -d "$RUNNER_TEMP/flagmega-venv.XXXXXX")"
          python3 -m venv --without-pip --system-site-packages "$FLAGMEGA_VENV"
          source "$FLAGMEGA_VENV/bin/activate"
          # Reuse the runner's CUDA PyTorch. Install the newer protobuf required
          # by FlagMega's OR-Tools in this job's environment.
          PIP_CONSTRAINT=/dev/null MAX_JOBS=32 python3 -m pip install \
            '.[flagmega]' pytest safetensors --no-build-isolation -v
          echo "FLAGMEGA_VENV=$FLAGMEGA_VENV" >> "$GITHUB_ENV"

      - name: Clear cache if ClearCache label present
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: nvidia

      - name: Run FlagMega tests
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          source ~/env.sh
          source "$FLAGMEGA_VENV/bin/activate"
          python3 -m pytest -s python/test/flagmega
