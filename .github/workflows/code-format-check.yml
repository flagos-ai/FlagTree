name: Code-Format-Check

on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ "main", "triton_v3.1.x", "triton_v3.2.x", "triton_v3.3.x", "triton_v3.4.x", "triton_v3.5.x", "triton_v3.6.x", "triton_v3.7.x"]
  pull_request:
    branches: [ "main", "triton_v3.1.x", "triton_v3.2.x", "triton_v3.3.x", "triton_v3.4.x", "triton_v3.5.x", "triton_v3.6.x", "triton_v3.7.x"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      id: checkout
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.BOT_PAT_TOKEN || github.token }}
    - name: Code format check
      uses: flagos-ai/FlagTree/.github/actions/code-format-check@main
