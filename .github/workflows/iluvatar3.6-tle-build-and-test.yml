name: Iluvatar3.6-TLE-Build-And-Test

on:
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iluvatar36x-tle-test:
    runs-on: iluvatar3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: iluvatar

      - name: Cleanup FlagTree Environment
        if: steps.check_backend.outputs.should_skip != 'true'
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Build FlagTree
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          export FLAGTREE_BACKEND=iluvatar
          export TRITON_OFFLINE_BUILD=1
          export TRITON_BUILD_PROTON=OFF
          export USE_FLAGCX=ON
          export FLAGCX_RECOMPILE=ON
          export FLAGCX_CACHE=clean
          export FLAGCX_ILUVATAR_CLANG="${FLAGCX_ILUVATAR_CLANG:-$(command -v clang)}"
          export FLAGCX_ILUVATAR_SDK="${FLAGCX_ILUVATAR_SDK:-$(dirname "$(dirname "$(realpath "$FLAGCX_ILUVATAR_CLANG")")")}"
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Clear cache if ClearCache label present
        if: steps.check_backend.outputs.should_skip != 'true'
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: iluvatar

      - name: Unit Test
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          source ~/env.sh
          export LD_LIBRARY_PATH=/usr/local/corex-4.5.0/lib64/:${LD_LIBRARY_PATH}

          if [[ "$(uname -m)" == "aarch64" ]]; then
            libgomp_path=$(find /usr/lib /usr/lib64 /lib /lib64 -type f -name 'libgomp.so*' 2>/dev/null | head -n 1)
            if [[ -n "$libgomp_path" ]]; then
              export LD_PRELOAD="$libgomp_path${LD_PRELOAD:+:$LD_PRELOAD}"
            fi
          fi

          # triton language unit test
          UMD_CUDAMODULELOADING=0 pytest third_party/iluvatar/python/test/unit/language/test_core.py
          pytest third_party/iluvatar/python/test/unit/language/test_annotations.py
          pytest third_party/iluvatar/python/test/unit/language/test_block_pointer.py
          pytest third_party/iluvatar/python/test/unit/language/test_compile_errors.py
          pytest third_party/iluvatar/python/test/unit/language/test_conversions.py
          pytest third_party/iluvatar/python/test/unit/language/test_decorator.py
          pytest third_party/iluvatar/python/test/unit/language/test_frontend.py
          pytest third_party/iluvatar/python/test/unit/language/test_libdevice.py
          pytest third_party/iluvatar/python/test/unit/language/test_iluvatar_math_fp16_bf16.py
          pytest third_party/iluvatar/python/test/unit/language/test_iluvatar_int8_upcast_dot_pipeline.py
          pytest third_party/iluvatar/python/test/unit/language/test_matmul.py
          pytest third_party/iluvatar/python/test/unit/language/test_mxfp.py
          pytest third_party/iluvatar/python/test/unit/language/test_pipeliner.py
          pytest third_party/iluvatar/python/test/unit/language/test_random.py
          pytest third_party/iluvatar/python/test/unit/language/test_reproducer.py
          pytest third_party/iluvatar/python/test/unit/language/test_standard.py
          pytest third_party/iluvatar/python/test/unit/language/test_subprocess.py
          UMD_CUDAMODULELOADING=0 pytest third_party/iluvatar/python/test/unit/language/test_tensor_descriptor.py
          pytest third_party/iluvatar/python/test/unit/language/test_tuple.py
          pytest third_party/iluvatar/python/test/unit/language/test_warp_specialization.py

          # TLE unit test
          pytest python/test/tle/integration/test_tle_local_store.py
          pytest python/test/tle/unit/test_tle_gpu_local_ptr.py
          pytest python/test/tle/unit/test_extract_tile_static_index.py
          pytest python/test/tle/unit/test_extract_tile_dynamic_index.py
          pytest python/test/tle/unit/test_insert_tile_static_index.py
          pytest python/test/tle/unit/test_insert_tile_dynamic_index.py
          pytest python/test/tle/unit/test_tle.py
          pytest python/test/tle/unit/test_tle_distributed.py
          pytest python/test/tle/unit/test_tle_raw_cache_key.py --deselect python/test/tle/unit/test_tle_raw_cache_key.py::test_mlir_dialect_cache_key_changes_with_edsl_source
          pytest python/test/tle/unit/test_tle_gpu_slot.py
          pytest python/test/tle/integration/test_tle_gemm.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_gemm.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_alloc.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_copy.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_async_load.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_memory_space.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_cumsum.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_pipeline.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_pipeline_e2e.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_warp_specialize.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_pipe.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_get_device_id.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_distributed.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_n_pes.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_distributed_barrier.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_remote_pointers.py
          pytest third_party/iluvatar/python/test/unit/tle/test_tle_raw.py

          if (( $(ixsmi -L 2>/dev/null | grep -c "^GPU") >= 2 )); then
            DIST_ENV="CUDA_VISIBLE_DEVICES=0,1 UMD_CUDAMODULELOADING=0 FLAGCX_MEM_ENABLE=1 NCCL_CUMEM_ENABLE=0 FLAGCX_USE_HETERO_COMM=1"
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29531 python/test/tle/unit/test_tle_get_local_pe.py
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29532 third_party/iluvatar/python/test/unit/tle/test_tle_get_device_id_multi_gpu.py
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29533 third_party/iluvatar/python/test/unit/tle/test_tle_n_pes_multi_gpu.py
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29534 third_party/iluvatar/python/test/unit/tle/test_tle_distributed_barrier_multi_gpu.py
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29535 third_party/iluvatar/python/test/unit/tle/test_tle_remote_pointers_multi_gpu.py
            env ${DIST_ENV} torchrun --nproc_per_node=2 --master_port=29536 python/test/tle/unit/test_tle_distributed_d2d.py
          fi

          # TLE tutorials unit tests
          python3 python/tutorials/tle/raw/cuda/01-vector-add.py
          python3 third_party/iluvatar/python/tutorials/tle/raw/cuda/02-fused-softmax.py
          python3 python/tutorials/tle/raw/cuda/03-matrix-multiplication.py
          python3 python/tutorials/tle/raw/cuda/03-matrix-multiplication-smem.py
          python3 python/tutorials/tle/raw/cuda/03-matrix-multiplication-smem-defered.py
          python3 third_party/iluvatar/python/tutorials/tle/01-fft.py --only_unit_test
          python3 third_party/iluvatar/python/tutorials/tle/02-moe_align_block_size.py
          python3 third_party/iluvatar/python/tutorials/tle/03-topk.py --only_unit_test
