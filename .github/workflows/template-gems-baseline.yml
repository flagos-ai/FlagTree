name: Template-Gems-Baseline

on:
  workflow_call:
    inputs:
      runner:
        description: 'Self-hosted runner label, e.g. nvidia3.6'
        required: true
        type: string
      backend:
        description: 'Backend name, e.g. nvidia, mthreads, ppu'
        required: true
        type: string
      gpu-env-var:
        description: 'GPU device environment variable name'
        required: false
        type: string
        default: 'CUDA_VISIBLE_DEVICES'
      flaggems-tag:
        description: 'FlagGems repo tag to test against'
        required: true
        type: string
      flaggems-pre-command:
        description: 'Multiline script to run before FlagGems tests (e.g. source env, set LD_LIBRARY_PATH)'
        required: false
        type: string
        default: ''
      flagtree-build-command:
        description: 'Multiline script to build and install FlagTree'
        required: true
        type: string
      env-setup-command:
        description: |
          Multiline bash script executed in the Setup Environment step.
          Only 'echo KEY=VALUE' output is appended to GITHUB_ENV, so these
          variables are visible to ALL later steps (build, test, compare).
          Do NOT use 'export' and do NOT print anything else to stdout.
          Example:
            echo "LD_LIBRARY_PATH=/usr/local/corex-4.5.0/lib64/:${LD_LIBRARY_PATH}"
            echo "PATH=/root/bin/:${PATH}"
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        description: 'Token for label lookups. Kept required for compatibility.'
        required: true
      # Reporting credentials. Optional: when a caller does not forward them
      # the reporting step finds no credentials and skips, which keeps this
      # template usable from branches that have not been updated.
      FLAGTREE_FEISHU_APP_ID:
        required: false
      FLAGTREE_FEISHU_APP_SECRET:
        required: false
      FLAGTREE_FEISHU_BITABLE_APP_TOKEN:
        required: false

env:
  FLAGGEMS_CI_DIR: '/root/flaggems_ci'
  GPU_ENV_VAR: ${{ inputs.gpu-env-var }}

jobs:
  # generate FlagGems baseline (only on push)
  gems-baseline:
    runs-on: ${{ inputs.runner }}
    # TEMP(local-ci-test): also allow pull_request so the baseline flow can be
    # exercised before merge. Restore to `github.event_name == 'push'` only.
    if: ${{ github.repository == 'flagos-ai/flagtree' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.runner }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      commit_id: ${{ steps.setup.outputs.commit_id }}
    steps:
      - name: Setup Environment and Paths
        id: setup
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E "^(http_proxy|https_proxy|all_proxy|no_proxy|${GPU_ENV_VAR})=" >> $GITHUB_ENV || true
          GPU_DEVICES="${!GPU_ENV_VAR:-0}"
          echo "gpus=$GPU_DEVICES" >> $GITHUB_OUTPUT
          echo "GPU devices: $GPU_DEVICES"
          echo "FlagGems tag: ${{ inputs.flaggems-tag }}"

          DATE=$(date +'%Y%m%d_%H%M%S')
          FLAGGEMS_REPO_DIR="${FLAGGEMS_CI_DIR}/FlagGems/baseline_${DATE}_${GITHUB_RUN_ID}"
          echo "FLAGGEMS_REPO_DIR=$FLAGGEMS_REPO_DIR" >> $GITHUB_OUTPUT

          COMMIT_ID="${GITHUB_SHA}"
          BASELINE_DIR="${FLAGGEMS_CI_DIR}/Baseline/${DATE}_${COMMIT_ID}"
          BASELINE_SUMMARY="${BASELINE_DIR}/summary.json"
          BEST_DIR="${FLAGGEMS_CI_DIR}/Baseline/best_FlagGems_${{ inputs.flaggems-tag }}"
          BEST_ARCHIVE_DIR="${FLAGGEMS_CI_DIR}/Baseline/best_archive_${{ inputs.runner }}"

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "baseline_dir=$BASELINE_DIR" >> $GITHUB_OUTPUT
          echo "baseline_summary=$BASELINE_SUMMARY" >> $GITHUB_OUTPUT
          echo "best_dir=$BEST_DIR" >> $GITHUB_OUTPUT
          echo "best_archive_dir=$BEST_ARCHIVE_DIR" >> $GITHUB_OUTPUT

          # Append KEY=VALUE lines produced by the user-provided setup command to GITHUB_ENV
          if [ -n '${{ inputs.env-setup-command }}' ]; then
            ${{ inputs.env-setup-command }} >> "$GITHUB_ENV"
          fi

      - name: Smart Checkout
        uses: ./.github/actions/smart-checkout
        with:
          checkout_version: 'v6'

      - name: Cleanup FlagTree Environment
        if: success()
        uses: ./.github/actions/cleanup-flagtree-env

      - name: Build FlagTree
        id: build
        if: success()
        shell: bash
        run: |
          ${{ inputs.flagtree-build-command }}

      - name: Clone FlagGems Repo
        if: success()
        uses: ./.github/actions/git-clone-retry
        with:
          repo-url: 'https://github.com/flagos-ai/FlagGems.git'
          ref: ${{ inputs.flaggems-tag }}
          clone-dir: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}

      - name: Run FlagGems Test for Baseline
        id: run-flaggems-test
        if: success()
        uses: ./.github/actions/run-flaggems-test
        with:
          flaggems-path: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          gpus: '${{ steps.setup.outputs.gpus }}'
          output-base-dir: '${{ env.FLAGGEMS_CI_DIR }}/Baseline'
          output-subdir: '${{ steps.setup.outputs.date }}_${{ steps.setup.outputs.commit_id }}'
          first-parameter-only: 'true'
          pre-command: ${{ inputs.flaggems-pre-command }}
          flaggems-tag: ${{ inputs.flaggems-tag }}
          backend: ${{ inputs.backend }}

      - name: Check Best Baseline Exists
        id: check-best
        if: success()
        shell: bash
        run: |
          BEST_SUMMARY="${{ steps.setup.outputs.best_dir }}/summary.json"
          if [[ -f "$BEST_SUMMARY" ]] && [[ -s "$BEST_SUMMARY" ]]; then
            echo "best_exists=true" >> $GITHUB_OUTPUT
          else
            echo "best_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Compare with Best Baseline
        id: compare-with-best
        if: ${{ success() && steps.check-best.outputs.best_exists == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/compare-flaggems-test
        with:
          baseline-dir: '${{ steps.setup.outputs.best_dir }}'
          candidate-dir: '${{ steps.run-flaggems-test.outputs.test-output-dir }}'
          fail-on-missing-baseline: 'true'

      - name: Update Best Baseline
        id: update-best
        if: ${{ success() && (steps.check-best.outputs.best_exists == 'false' || steps.compare-with-best.outputs.compare-exit-code == '0') }}
        shell: bash
        run: |
          DATE="${{ steps.setup.outputs.date }}"
          COMMIT_ID="${{ steps.setup.outputs.commit_id }}"
          BASELINE_DIR="${{ steps.setup.outputs.baseline_dir }}"
          BASELINE_SUMMARY="${{ steps.setup.outputs.baseline_summary }}"
          BEST_DIR="${{ steps.setup.outputs.best_dir }}"
          ARCHIVE_DIR="${{ steps.setup.outputs.best_archive_dir }}/${DATE}"

          if [[ -f "$BASELINE_SUMMARY" ]] && [[ -s "$BASELINE_SUMMARY" ]]; then
            if [[ -d "$BEST_DIR" ]]; then
              mkdir -p "$ARCHIVE_DIR"
              mv "$BEST_DIR" "$ARCHIVE_DIR"
            fi
            mkdir -p "$BEST_DIR"
            cp -raf "$BASELINE_DIR"/* "$BEST_DIR/"
            echo "$DATE : $COMMIT_ID" > "${BEST_DIR}/commit_id.txt"
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Baseline generation failed - summary.json not found or empty"
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Runs even when an earlier step failed, so a broken nightly baseline is
      # recorded too. Never allowed to fail the job.
      - name: Collect FlagGems Record
        id: collect
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CTX_KIND: baseline
          CTX_BACKEND: ${{ inputs.backend }}
          CTX_RUNNER: ${{ inputs.runner }}
          CTX_FLAGGEMS_TAG: ${{ inputs.flaggems-tag }}
          CTX_FLAGTREE_SHA: ${{ github.sha }}
          CTX_FLAGTREE_BRANCH: ${{ github.ref_name }}
          CTX_ACTOR: ${{ github.actor }}
          CTX_RUN_ID: ${{ github.run_id }}
          CTX_RUN_ATTEMPT: ${{ github.run_attempt }}
          CTX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # outcome, not conclusion: continue-on-error rewrites conclusion
          CTX_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTX_TEST_OUTCOME: ${{ steps.run-flaggems-test.outcome }}
          # Whether this run became the new best baseline
          CTX_BEST_UPDATED: ${{ steps.update-best.outcome == 'success' }}
          OUT_DIR: ${{ steps.run-flaggems-test.outputs.test-output-dir }}
          BASELINE_DIR: ${{ steps.setup.outputs.best_dir }}
        run: |
          if [[ -z "${OUT_DIR}" || ! -f "${OUT_DIR}/summary.json" ]]; then
            echo "No summary.json under '${OUT_DIR}', nothing to collect."
            exit 0
          fi

          # Run from the checkout, not the FlagGems clone, which the cleanup
          # step below removes.
          python3 "${GITHUB_WORKSPACE}/.github/workflows/gems/ci/collect_gems_record.py" \
            --summary "${OUT_DIR}/summary.json" \
            --baseline-dir "${BASELINE_DIR}" \
            --ledger "${FLAGGEMS_CI_DIR}/Ledger/runs.jsonl" \
            --op-ledger "${FLAGGEMS_CI_DIR}/Ledger/operators.jsonl"

          echo "record-file=${OUT_DIR}/record.json" >> $GITHUB_OUTPUT

      - name: Report Record to Feishu
        if: ${{ always() && steps.collect.outputs.record-file != '' }}
        continue-on-error: true
        uses: ./.github/actions/report-feishu
        with:
          record: ${{ steps.collect.outputs.record-file }}
          table-name: flaggems_runs
          schema: ${{ github.workspace }}/.github/workflows/gems/ci/flaggems_runs.schema.json
          dedup-field: record_id
          app-id: ${{ secrets.FLAGTREE_FEISHU_APP_ID }}
          app-secret: ${{ secrets.FLAGTREE_FEISHU_APP_SECRET }}
          app-token: ${{ secrets.FLAGTREE_FEISHU_BITABLE_APP_TOKEN }}

      - name: Cleanup FlagGems Repo
        if: always()
        shell: bash
        env:
          REPO_DIR: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}
        run: |
          set -u

          if [[ -z "${REPO_DIR}" || "${REPO_DIR}" == "/" || "${REPO_DIR}" == "/root" || "${REPO_DIR}" == "/data" ]]; then
            echo "REPO_DIR is empty or unsafe (${REPO_DIR}), skip cleanup"
            exit 0
          fi

          for i in 1 2 3; do
            if rm -rf "${REPO_DIR}"; then
              echo "Cleanup succeeded on attempt $i"
              exit 0
            fi
            if [[ $i -lt 3 ]]; then
              echo "Cleanup attempt $i failed, retrying in 30s..."
              sleep 30
            fi
          done

          echo "::warning::Failed to remove ${REPO_DIR} after 3 attempts, dumping contents"
          ls -la "${REPO_DIR}" 2>/dev/null | head -50 || true
          exit 0
