name: Nvidia3.6-FlagGems-Test

on:
  push:
    branches: [ "main", "fix/my-bug-fix-main-v7-best-and-separate" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  FLAGGEMS_TAG: 'v5.3.5'
  FLAGGEMS_CI_DIR: '/root/flaggems_ci'

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Group by PR number for pull_request events to cancel outdated runs from the same PR.
  # Group by commit SHA for push events to allow parallel runs from different merges.
  # Fall back to run_id for other events (e.g., schedule) to ensure each run is independent.
  group: ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number ||
    github.event_name == 'push' && github.event.head_commit.id ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  # Job 1: generate FlagGems baseline (only on push)
  generate-flaggems-baseline:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event_name == 'push' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-'nvidia3.6'
      cancel-in-progress: false
    outputs:
      commit_id: ${{ steps.set-commit.outputs.commit_id }}
    steps:
      - name: Setup Environment
        id: setup
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy|CUDA_VISIBLE_DEVICES)=' >> $GITHUB_ENV || true
          GPU_DEVICES="${CUDA_VISIBLE_DEVICES:-0}"
          echo "gpus=$GPU_DEVICES" >> $GITHUB_OUTPUT
          echo "GPU devices: $GPU_DEVICES"
          echo "FlagGems tag: $FLAGGEMS_TAG"

          FLAGGEMS_REPO_DIR="${FLAGGEMS_CI_DIR}/FlagGems/baseline_${GITHUB_RUN_ID}"
          echo "FLAGGEMS_REPO_DIR=$FLAGGEMS_REPO_DIR" >> $GITHUB_OUTPUT
          echo "✅ FlagGems repo: $FLAGGEMS_REPO_DIR"

      - name: Set Commit ID and Paths
        id: set-commit
        shell: bash
        run: |
          DATE=$(date +'%Y%m%d_%H%M%S')
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Date: $DATE"

          COMMIT_ID="${GITHUB_SHA}"
          BASELINE_DIR="${FLAGGEMS_CI_DIR}/Baseline/${DATE}_${COMMIT_ID}"
          BASELINE_SUMMARY="${BASELINE_DIR}/summary.json"
          BEST_DIR="${FLAGGEMS_CI_DIR}/Baseline/best_FlagGems_${FLAGGEMS_TAG}"
          BEST_ARCHIVE_DIR="${FLAGGEMS_CI_DIR}/Baseline/best_archive"

          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "baseline_dir=$BASELINE_DIR" >> $GITHUB_OUTPUT
          echo "baseline_summary=$BASELINE_SUMMARY" >> $GITHUB_OUTPUT
          echo "best_dir=$BEST_DIR" >> $GITHUB_OUTPUT
          echo "best_archive_dir=$BEST_ARCHIVE_DIR" >> $GITHUB_OUTPUT

          echo "BASELINE_DIR=$BASELINE_DIR" >> $GITHUB_ENV
          echo "BASELINE_SUMMARY=$BASELINE_SUMMARY" >> $GITHUB_ENV
          echo "BEST_DIR=$BEST_DIR" >> $GITHUB_ENV
          echo "BEST_ARCHIVE_DIR=$BEST_ARCHIVE_DIR" >> $GITHUB_ENV

          echo "📝 Commit ID: $COMMIT_ID"
          echo "📁 Baseline dir: $BASELINE_DIR"
          echo "📄 Summary file: $BASELINE_SUMMARY"
          echo "📁 BEST dir: $BEST_DIR"

      - name: Smart Checkout
        id: smart-checkout-flagtree
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'
        continue-on-error: false

      - name: Cleanup FlagTree Environment
        id: cleanup-flagtree-env
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main
        if: success()

      - name: Install FlagTree
        id: install-flagtree
        shell: bash
        if: success()
        run: |
          set -x
          source ~/env-3.6.sh
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Clone FlagGems Repo
        id: clone-flaggems
        uses: flagos-ai/FlagTree/.github/actions/git-clone-retry@main
        if: success()
        with:
          repo-url: 'https://github.com/flagos-ai/FlagGems.git'
          ref: ${{ env.FLAGGEMS_TAG }}
          clone-dir: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}

      - name: Run FlagGems Test for Baseline
        id: run-flaggems-test
        uses: ./.github/actions/run-flaggems-test
        if: success()
        with:
          flaggems-path: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          gpus: '${{ steps.setup.outputs.gpus }}'
          output-base-dir: '${{ env.FLAGGEMS_CI_DIR }}/Baseline'
          output-subdir: '${{ steps.set-commit.outputs.date }}_${{ steps.set-commit.outputs.commit_id }}'
          run-script: 'tools/ci/ci_run_tests.py'
          skip-file: 'tools/ci/skip_list.yaml'
          first-parameter-only: 'true'

      - name: Check Best Baseline Exists
        id: check-best
        shell: bash
        if: success()
        run: |
          BEST_SUMMARY="${{ steps.set-commit.outputs.best_dir }}/summary.json"
          if [[ -f "$BEST_SUMMARY" ]] && [[ -s "$BEST_SUMMARY" ]]; then
            echo "best_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Best baseline exists"
          else
            echo "best_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No best baseline found, this will be the first"
          fi

      - name: Compare with Best Baseline
        id: compare-with-best
        uses: ./.github/actions/compare-flaggems-test
        if: ${{ success() && steps.check-best.outputs.best_exists == 'true' }}
        continue-on-error: true
        with:
          baseline-dir: '${{ steps.set-commit.outputs.best_dir }}'
          candidate-dir: '${{ steps.run-flaggems-test.outputs.test-output-dir }}'
          compare-script: 'tools/ci/compare_test_result.py'
          working-directory: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          fail-on-missing-baseline: 'true'

      - name: Update Best Baseline
        id: update-best
        shell: bash
        if: ${{ success() && (steps.check-best.outputs.best_exists == 'false' || steps.compare-with-best.outputs.compare-exit-code == '0') }}
        run: |
          DATE="${{ steps.set-commit.outputs.date }}"
          COMMIT_ID="${{ steps.set-commit.outputs.commit_id }}"
          BASELINE_DIR="${{ steps.set-commit.outputs.baseline_dir }}"
          BASELINE_SUMMARY="${{ steps.set-commit.outputs.baseline_summary }}"
          BEST_DIR="${{ steps.set-commit.outputs.best_dir }}"
          ARCHIVE_DIR="${{ steps.set-commit.outputs.best_archive_dir }}/${DATE}"

          if [[ -f "$BASELINE_SUMMARY" ]] && [[ -s "$BASELINE_SUMMARY" ]]; then
            echo "✅ Baseline generated successfully for commit: $COMMIT_ID"

            if [[ -d "$BEST_DIR" ]]; then
              mkdir -p "$ARCHIVE_DIR"
              echo "📦 Archiving old best to: $ARCHIVE_DIR"
              mv "$BEST_DIR" "$ARCHIVE_DIR"
            fi

            # Create best directory and copy baseline files
            mkdir -p "$BEST_DIR"

            # Copy all files from commit directory to best
            cp -raf "$BASELINE_DIR"/* "$BEST_DIR/"

            # Also copy the commit ID for reference
            echo "$DATE : $COMMIT_ID" > "${BEST_DIR}/commit_id.txt"

            echo "✅ Best baseline updated to commit: $COMMIT_ID"
            echo "📁 Best baseline location: $BEST_DIR"
            echo "📄 Best summary: ${BEST_DIR}/summary.json"

            echo "baseline_exists=true" >> $GITHUB_OUTPUT
            echo "baseline_summary=${BASELINE_SUMMARY}" >> $GITHUB_OUTPUT
            echo "BASELINE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "❌ Baseline generation failed - summary.json not found or empty"
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
            echo "BASELINE_EXISTS=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Cleanup FlagGems Repo
        id: cleanup-flaggems-repo
        shell: bash
        if: always()
        run: |
          if [[ -d "${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}" ]]; then
            echo "🧹 Cleaning up FlagGems repo: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}"
            rm -rf "${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}"
            echo "✅ FlagGems repo cleaned up"
          else
            echo "ℹ️ FlagGems repo directory not found, skipping cleanup"
          fi

  # Job 2: main job - run FlagGems test
  flaggems-test:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    steps:
      - name: Setup Environment
        id: setup
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy|CUDA_VISIBLE_DEVICES)=' >> $GITHUB_ENV || true
          GPU_DEVICES="${CUDA_VISIBLE_DEVICES:-0}"
          echo "gpus=$GPU_DEVICES" >> $GITHUB_OUTPUT
          echo "GPU devices: $GPU_DEVICES"
          echo "FlagGems tag: $FLAGGEMS_TAG"

          FLAGGEMS_REPO_DIR="${FLAGGEMS_CI_DIR}/FlagGems/test_${GITHUB_RUN_ID}"
          echo "FLAGGEMS_REPO_DIR=$FLAGGEMS_REPO_DIR" >> $GITHUB_OUTPUT
          echo "FLAGGEMS_REPO_DIR=$FLAGGEMS_REPO_DIR" >> $GITHUB_ENV
          echo "✅ FlagGems repo: $FLAGGEMS_REPO_DIR"

      - name: Smart Checkout
        id: smart-checkout-flagtree
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        if: success()
        with:
          backend: nvidia

      - name: Cleanup FlagTree Environment
        id: cleanup-flagtree-env
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Install FlagTree
        id: install-flagtree
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          set -x
          source ~/env-3.6.sh
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Clone FlagGems Repo
        id: clone-flaggems
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/git-clone-retry@main
        with:
          repo-url: 'https://github.com/flagos-ai/FlagGems.git'
          ref: ${{ env.FLAGGEMS_TAG }}
          clone-dir: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}

      - name: Clear cache if ClearCache label present
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' }}
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: nvidia

      - name: Run FlagGems Test
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/run-flaggems-test
        id: run-flaggems-test
        with:
          flaggems-path: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          gpus: '${{ steps.setup.outputs.gpus }}'
          output-base-dir: '${{ env.FLAGGEMS_CI_DIR }}/PR'
          pr-number: '${{ github.event.pull_request.number }}'
          run-script: 'tools/ci/ci_run_tests.py'
          skip-file: 'tools/ci/skip_list.yaml'
          first-parameter-only: 'true'

      - name: Compare with Baseline
        id: compare-baseline
        if: ${{ success() && steps.check_backend.outputs.should_skip != 'true' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/compare-flaggems-test
        with:
          baseline-dir: '${{ env.FLAGGEMS_CI_DIR }}/Baseline/best_FlagGems_${{ env.FLAGGEMS_TAG }}'
          candidate-dir: '${{ steps.run-flaggems-test.outputs.test-output-dir }}'
          compare-script: 'tools/ci/compare_test_result.py'
          working-directory: '${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}/FlagGems'
          fail-on-missing-baseline: 'true'

      - name: Cleanup FlagGems Repo
        id: cleanup-flaggems-repo
        shell: bash
        if: always()
        run: |
          if [[ -d "${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}" ]]; then
            echo "🧹 Cleaning up FlagGems repo: ${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}"
            rm -rf "${{ steps.setup.outputs.FLAGGEMS_REPO_DIR }}"
            echo "✅ FlagGems repo cleaned up"
          else
            echo "ℹ️ FlagGems repo directory not found, skipping cleanup"
          fi
