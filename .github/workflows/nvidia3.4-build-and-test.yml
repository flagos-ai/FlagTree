name: Nvidia3.4-Build-And-Test

on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ "triton_v3.4.x" ]
  pull_request:
    branches: [ "triton_v3.4.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nv-34x-unit-test:
    runs-on: nvidia3.5
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: nvidia

      - name: Cleanup FlagTree Environment
        if: steps.check_backend.outputs.should_skip != 'true'
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Detect Target Branch
        shell: bash
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH"

      - name: Build FlagTree
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          pip uninstall -y triton
          source ~/env-3.4.sh
          MAX_JOBS=32 python3.12 -m pip install . --no-build-isolation

      - name: Clear cache if ClearCache label present
        if: steps.check_backend.outputs.should_skip != 'true'
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: nvidia

      - name: Unit Test
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          python3.12 -m pytest -s python/test/unit/cuda
          python3.12 -m pytest -s python/test/unit/instrumentation
          python3.12 -m pytest -s python/test/unit/language \
              --ignore=python/test/unit/language/test_line_info.py
          python3.12 -m pytest -s python/test/unit/runtime
          if [ -d "python/test/operators" ]; then
            python3.12 -m pytest -s python/test/operators
          fi
