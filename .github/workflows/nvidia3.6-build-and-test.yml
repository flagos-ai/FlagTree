name: Nvidia3.6-Build-And-Test

on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nv36x-unit-test:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: nvidia

      - name: Clone FlagGems Repo
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: ./.github/actions/git-clone-retry
        with:
          repo-url: 'https://github.com/flagos-ai/FlagGems.git'
          ref: 'v5.3.4'
          clone-dir: '/root/flaggems_ci'

      - name: Install FlagGems
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          cd /root/flaggems_ci/FlagGems
          python3 -m pip uninstall -y flag_gems --break-system-packages || true
          pip install -v -e . --no-build-isolation --no-deps

      - name: Cleanup FlagTree Environment
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Detect Target Branch
        shell: bash
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH"

      - name: Build FlagTree
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          set -x
          source ~/env-3.6.sh
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Clear cache if ClearCache label present
        if: steps.check_backend.outputs.should_skip != 'true'
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: nvidia

      - name: Unit Test
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          set -x
          source ~/env.sh
          ## python tutorials
          python3 python/tutorials/01-vector-add.py --only_unit_test
          python3 python/tutorials/02-fused-softmax.py --only_unit_test
          python3 python/tutorials/03-matrix-multiplication.py --only_unit_test
          python3 python/tutorials/04-low-memory-dropout.py --only_unit_test
          python3 python/tutorials/05-layer-norm.py --only_unit_test
          python3 python/tutorials/06-fused-attention.py --only_unit_test
          python3 python/tutorials/07-extern-functions.py --only_unit_test
          python3 python/tutorials/08-grouped-gemm.py --only_unit_test
          python3 python/tutorials/09-persistent-matmul.py --only_unit_test
          python3 python/tutorials/11-programmatic-dependent-launch.py --only_unit_test
          python3 python/tutorials/12-fused_inv_rope_fp8_quant_reorder.py --only_unit_test
          ## python unit test
          python3 -m pytest -s python/test/unit/cuda
          python3 -m pytest -s python/test/unit/instrumentation
          python3 -m pytest -s python/test/unit/language \
              --ignore=python/test/unit/language/test_line_info.py
          python3 -m pytest -s python/test/unit/runtime
          if [ -d "python/test/operators" ]; then
            python3 -m pytest -s python/test/operators
          fi
          ## flagtree tle python tutorials
          python3 python/tutorials/tle/01-fft.py
          python3 python/tutorials/tle/02-moe_align_block_size.py
          python3 python/tutorials/tle/03-topk.py
          python3 python/tutorials/tle/04-cluster-gemm.py
          python3 python/tutorials/tle/deepseek_v32/01-topk_selector.py
          python3 python/tutorials/tle/deepseek_v32/02-sparse-mla.py
          ## flagtree tle python unit test
          python3 -m pytest -s python/test/tle/integration
          python3 -m pytest -s python/test/tle/unit \
              --ignore=python/test/tle/unit/test_tle_distributed_d2d.py \
              --ignore=python/test/tle/unit/test_tle_get_local_pe.py \
              --ignore=python/test/tle/unit/test_tle_d2d_barrier.py \
              --ignore=python/test/tle/unit/test_tle_get_node_rank.py \
              --ignore=python/test/tle/unit/test_tle_signal.py \
              --ignore=python/test/tle/unit/test_tle_signal_wait.py
          ## flagtree hints python tutorials
          python3 python/tutorials/hints/01/01-vector-add.py --only_unit_test
          # python3 python/tutorials/hints/02/02-fused-softmax.py --only_unit_test
          python3 python/tutorials/hints/03/03-matrix-multiplication.py --only_unit_test
          python3 python/tutorials/hints/04/04-low-memory-dropout.py --only_unit_test
          python3 python/tutorials/hints/05/05-layer-norm.py --only_unit_test
          # python3 python/tutorials/hints/06/06-fused-attention.py --only_unit_test  # Error on 3.6
          python3 python/tutorials/hints/07/07-extern-functions.py --only_unit_test
          python3 python/tutorials/hints/08/08-grouped-gemm.py --only_unit_test
          python3 python/tutorials/hints/11/11-programmatic-dependent-launch.py --only_unit_test
          ## flagtree tle raw
          python3 python/tutorials/tle/raw/mlir/01-vector-add.py
          python3 python/tutorials/tle/raw/mlir/02-fused-softmax.py
          python3 python/tutorials/tle/raw/mlir/03-matrix-multiplication.py
          python3 python/tutorials/tle/raw/mlir/04-hello-world.py
          python3 python/tutorials/tle/raw/mlir/05-topk.py --kernel triton
          python3 python/tutorials/tle/raw/mlir/05-topk.py --kernel tle
          python3 python/tutorials/tle/raw/mlir/06-test-vassert.py
          ## flagtree tle cuda
          export CLANG=/usr/local/lib/python3.12/dist-packages/mlir/llvm_artifact/bin/clang-22
          python3 python/tutorials/tle/raw/cuda/01-vector-add.py
          python3 python/tutorials/tle/raw/cuda/02-fused-softmax.py
          python3 python/tutorials/tle/raw/cuda/03-matrix-multiplication.py
          python3 python/tutorials/tle/raw/cuda/03-matrix-multiplication-smem.py

      - name: Run FlagGems Test
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: ./.github/actions/run-flaggems-test
        id: run-flaggems-test
        with:
          flaggems-path: '/root/flaggems_ci/FlagGems'
          gpus: ${CUDA_VISIBLE_DEVICES:-0}
          output-base-dir: '/root/flaggems_ci/PR'
          pr-number: '${{ github.event.pull_request.number }}'
          run-script: 'tools/ci/ci_run_tests.py'
          skip-file: 'tools/ci/skip_list.yaml'
          first-parameter-only: 'true'

      - name: Compare with Baseline
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: ./.github/actions/compare-flaggems-test
        with:
          baseline-dir: '/root/flaggems_ci/Baseline'
          candidate-dir: ${{ steps.run-flaggems-test.outputs.test-output-dir }}
          baseline-date: ${{ steps.run-flaggems-test.outputs.test-date }}
          compare-script: 'tools/ci/compare_test_result.py'
          working-directory: '/root/flaggems_ci/FlagGems'
