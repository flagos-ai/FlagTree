name: Hcu3.6

on:
  schedule:
    - cron: '30 20 * * *'
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hcu36x:
    strategy:
      fail-fast: false
      matrix:
        runner: [hcu3.6, hcu3.6-bw1100]
    runs-on: ${{ matrix.runner }}
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: hcu

      - name: Cleanup FlagTree Environment
        if: steps.check_backend.outputs.should_skip != 'true'
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Build FlagTree
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          export FLAGTREE_BACKEND=hcu
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Clear cache if ClearCache label present
        if: steps.check_backend.outputs.should_skip != 'true'
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: hcu

      - name: Unit Test
        if: steps.check_backend.outputs.should_skip != 'true'
        shell: bash
        run: |
          set -x
          source ~/env.sh
          export PYTHONPATH=~/.flagtree/hcu/hcu-llvm22-188a510-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/python_packages/mlir_core/:$PYTHONPATH
          _FLAGTREE_TEST_DEVICE_AUTOTUNE=1 python3 -m pytest -s python/test/unit/test_function_autotune.py
          python3 -m pytest -s third_party/hcu/python/test/unit
          python3 -m pytest -s python/test/tle/integration/test_tle_local_store.py
          python3 -m pytest -s python/test/tle/integration/test_tle_gemm.py
          python3 -m pytest -s python/test/tle/integration/test_tle_pipeline_e2e.py
          python3 -m pytest -s python/test/tle/integration/test_tle_topk_smem_fallback.py
          python3 -m pytest -s python/test/tle/unit/test_tle_gpu_local_ptr.py
          python3 -m pytest -s python/test/tle/unit/test_tle_gpu_slot.py
          python3 -m pytest -s python/test/tle/unit/test_tle_cumsum.py
          python3 -m pytest -s python/test/tle/unit/test_extract_tile_dynamic_index.py
          python3 -m pytest -s python/test/tle/unit/test_extract_tile_static_index.py
          python3 -m pytest -s python/test/tle/unit/test_insert_tile_dynamic_index.py
          python3 -m pytest -s python/test/tle/unit/test_insert_tile_static_index.py
          python3 python/tutorials/tle/01-fft.py
          python3 python/tutorials/tle/03-topk.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/01-vector-add.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/02-fused-softmax.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/03-matrix-multiplication.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/03-matrix-multiplication-smem.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/03-matrix-multiplication-smem-defered.py
          python3 third_party/hcu/python/tutorials/tle/raw/hip/05-sort.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/01-vector-add-defered.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/01-vector-add.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/02-fused-softmax.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/03-matrix-multiplication-smem.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/03-matrix-multiplication.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/04-hello-world.py
          python3 third_party/hcu/python/tutorials/tle/raw/mlir/05-topk.py --kernel tle
