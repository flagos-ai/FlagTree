name: test_workflow_dispatch

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      WHL_VER:
        description: '0.6.0.dev1 < 0.6.0a1 < 0.6.0b1 < 0.6.0rc1 < 0.6.0 < 0.6.0.post1'
        required: true
        default: '0.6.0'
      PYTHON_VER:
        required: true
        default: '3.10'
      PLATFORM:
        required: true
        default: 'x86_64'
      BRANCH:
        required: true
        default: 'triton_v3.2.x'
      TRITON:
        required: true
        default: '3.2'
      BACKEND:
        required: true
        default: 'mthreads'
      FLAGTREE_PYPI_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.WHL_VER }}-${{ inputs.PYTHON_VER }}-${{ inputs.PLATFORM }}
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: mthreads3.2-cd
    if: ${{ github.repository == 'flagos-ai/flagtree' }}
    steps:
      - name: Check branch
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.ref_name }}"
          if [[ ! "$TARGET_BRANCH" =~ ^(${{ inputs.BRANCH }})$ ]]; then
            echo "❌ This workflow must be run from branch '${{ inputs.BRANCH }}', but got '${TARGET_BRANCH}'"
          fi
          echo "✅ Branch check passed: ${TARGET_BRANCH}"

      - name: Print Inputs
        shell: bash
        run: |
          echo "🚀 Workflow Inputs:"
          echo "WHL_VER: ${{ inputs.WHL_VER }}"
          echo "PYTHON_VER: ${{ inputs.PYTHON_VER }}"
          echo "PLATFORM: ${{ inputs.PLATFORM }}"
          echo "BRANCH: ${{ inputs.BRANCH }}"
          echo "TRITON: ${{ inputs.TRITON }}"
          echo "BACKEND: ${{ inputs.BACKEND }}"
