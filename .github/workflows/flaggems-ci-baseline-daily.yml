name: FlagGems-Baseline-Daily

on:
  schedule:
    # 每天 UTC 03:59 执行，对应北京时间上午 11:59
    - cron: '59 3 * * *'
  workflow_dispatch:  # 支持手动触发，方便调试或补跑
  pull_request:        # 临时加上，用于测试
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  baseline-test:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Update and Install Baseline FlagTree
        shell: bash
        run: |
          set -x
          cd /data/zhengyang/flaggems_ci/FlagTree
          git pull --rebase
          source ~/env-3.6.sh
          python3 -m pip uninstall -y flagtree --break-system-packages || true
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v

      - name: Install FlagGems
        shell: bash
        run: |
          set -x
          cd /data/zhengyang/flaggems_ci/FlagGems
          python3 -m pip uninstall -y flag_gems --break-system-packages || true
          pip install -v -e . --no-build-isolation --no-deps

      - name: Run Baseline Tests
        shell: bash
        run: |
          set -x
          cd /data/zhengyang/flaggems_ci/FlagGems
          OUTPUT_DIR="/data/zhengyang/flaggems_ci/Baseline/$(date +%Y-%m-%d)"
          mkdir -p "$OUTPUT_DIR"
          python tools/ci/ci_run_tests_v8.py \
            --gpus 4 \
            --output-dir "$OUTPUT_DIR" \
            --first-parameter-only \
            --skip-file tools/ci/skip_list.yaml
