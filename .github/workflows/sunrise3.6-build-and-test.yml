name: Sunrise cache source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: sunrise3.6
    timeout-minutes: 3
    steps:
      - name: Read LLVM and STVM source metadata
        shell: bash
        run: |
          python3 - <<'SDK_METADATA'
          from pathlib import Path
          import json, subprocess
          root = Path('/root/ci_flagtree_v0.6/.flagtree/sunrise')
          print('SDK_CACHE_ROOT', root, 'exists', root.exists())
          if root.exists():
              for package in sorted(root.glob('sunrise_llvm*'))[:5]:
                  if not package.is_dir():
                      continue
                  print('SDK_PACKAGE_DIRECTORY', package.name)
                  clang = package / 'bin' / 'clang'
                  if clang.is_file():
                      result = subprocess.run([str(clang), '--version'], capture_output=True, text=True, timeout=15)
                      print('NORMAL_COMPILER_VERSION', result.returncode, result.stdout[:2000], result.stderr[:500])
                  header = package / 'include' / 'llvm' / 'Config' / 'llvm-config.h'
                  if header.is_file():
                      for line in header.read_text().splitlines():
                          if any(key in line for key in ('LLVM_VERSION', 'LLVM_REVISION', 'LLVM_REPOSITORY')):
                              print('SOURCE_VERSION_METADATA', line)
                  import hashlib
                  include = package / 'include'
                  candidates = [path for path in include.rglob('*') if path.is_file() and 'STVM' in str(path).upper() and path.suffix in ('.h', '.inc')]
                  for header in sorted(candidates):
                      source = header.read_text()
                      if 'ShflOp' not in source:
                          continue
                      print('STVM_SOURCE_HEADER', str(header.relative_to(package)), hashlib.sha256(source.encode()).hexdigest())
                      lines = source.splitlines()
                      selected = [i for i, line in enumerate(lines) if 'ShflOp::create' in line or 'ShflOp::build' in line or 'class ShflOp :' in line]
                      for i in selected[:10]:
                          print('STVM_SOURCE_API', '\n'.join(lines[i:i+3]))
          print('Only source headers and normal compiler metadata inspected.')
          SDK_METADATA
