name: Auto-Rerun

on:
  workflow_run:
    workflows:
      - "Amd3.6-Build-And-Test"
      - "Enflame3.6-GCU300-Build-And-Test"
      - "Enflame3.6-GCU400-Build-And-Test"
      - "FlagCICD-NV3.6-Build-And-Test"
      - "Hcu3.6-Build-And-Test"
      - "Hcu3.6-Gems-Baseline"
      - "Hcu3.6-Gems-Test"
      - "Hcu3.6-Qwen-Benchmark"
      - "Iluvatar3.6-Build-And-Test"
      - "Iluvatar3.6-Gems-Baseline"
      - "Iluvatar3.6-Gems-Test"
      - "Iluvatar3.6-Qwen-Benchmark"
      - "Iluvatar3.6-TLE-Build-And-Test"
      - "Metax3.6-Build-And-Test"
      - "Metax3.6-Gems-Baseline"
      - "Metax3.6-Gems-Test"
      - "Metax3.6-Qwen-Benchmark"
      - "Mthreads3.6-Build-And-Test"
      - "Mthreads3.6-Gems-Baseline"
      - "Mthreads3.6-Gems-Test"
      - "Mthreads3.6-Qwen-Benchmark"
      - "Nvidia3.6-Build-And-Test"
      - "Nvidia3.6-Gems-Baseline"
      - "Nvidia3.6-Gems-Test"
      - "Nvidia3.6-Qwen-Benchmark"
      - "Nvidia3.6-Single-Dist-Test"
      - "Ppu3.6-Build-And-Test"
      - "Ppu3.6-Core-Build-And-Test"
      - "Ppu3.6-Gems-Baseline"
      - "Ppu3.6-Gems-Test"
      - "Ppu3.6-Qwen-Benchmark"
      - "Rpu3.6-Build-And-Test"
      - "Spacemit3.6-Build-And-Test"
      - "Sunrise3.6-Build-And-Test"
      - "Thrive3.6-Build-And-Test"
      - "TileIR3.6-Build-And-Test"
      - "Tsingmicro3.6-Build-And-Test"
      - "Xpu3.6-Build-And-Test"
    types: [completed]

permissions:
  actions: write      # Required to trigger rerun via the API
  contents: read

jobs:
  rerun:
    # Only act on failed runs that have not exceeded the retry budget.
    # run_attempt is incremented by BOTH automatic (watchdog) and manual reruns,
    # so once it reaches 5 the watchdog stops intervening.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    steps:
      - name: Check transient failure patterns in failed jobs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          REPO=${{ github.repository }}

          echo "Checking run $RUN_ID (run_attempt=${{ github.event.workflow_run.run_attempt }}) ..."

          # Fetch failed job ids, with a few retries to survive transient API 503s.
          failed_job_ids=""
          for i in 1 2 3; do
            failed_job_ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.conclusion=="failure") | .id' 2>/dev/null || true)
            if [ -n "$failed_job_ids" ]; then
              break
            fi
            echo "gh api .../jobs returned empty (attempt $i), retrying in 5s..."
            sleep 5
          done

          if [ -z "$failed_job_ids" ]; then
            echo "No failed jobs found (or API unavailable). Skip rerun."
            echo "should_rerun=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Failed job ids:"
          echo "$failed_job_ids"

          # Named transient-failure patterns. Each entry is "name|regex".
          # Matching is done against the WHOLE job log, so patterns are not
          # limited to the "Set up job" step. Add a new line to cover another
          # stage/failure kind. Keep regexes anchored enough to avoid matching
          # real build/test failures.
          PATTERNS=(
            # "Set up job" exhausted retries (the runner gives up):
            #   Error: Failed to download archive '...' after N attempts.
            # Do NOT match the per-attempt "Warning" lines.
            "set-up-job-download-exhausted|Failed to download archive .* after [0-9]+ (attempts|retries)"
            # "Set up job" download timeout:
            #   Error: Action '...' download has timed out.
            "set-up-job-download-timeout|Action .* download has timed out"
          )

          should_rerun=false
          matched_pattern=""
          for job_id in $failed_job_ids; do
            echo "----- Fetching log for job $job_id -----"
            log=$(gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null || true)

            echo "----- Log size: $(echo "$log" | wc -c) bytes -----"

            hit=""
            for entry in "${PATTERNS[@]}"; do
              name="${entry%%|*}"
              regex="${entry#*|}"
              if echo "$log" | grep -qE "$regex"; then
                hit="$name"
                break
              fi
            done

            if [ -n "$hit" ]; then
              echo "MATCH: job $job_id hit pattern '$hit' (transient failure, safe to rerun)."
              should_rerun=true
              matched_pattern="$hit"
              break
            else
              echo "NO MATCH for job $job_id"
            fi
          done

          echo "should_rerun=$should_rerun" >> "$GITHUB_OUTPUT"
          if [ -n "$matched_pattern" ]; then
            echo "matched_pattern=$matched_pattern" >> "$GITHUB_OUTPUT"
          fi

      - name: Rerun failed jobs
        if: steps.check.outputs.should_rerun == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          REPO=${{ github.repository }}
          echo "Transient failure (${{ steps.check.outputs.matched_pattern }}) detected. Rerunning failed jobs of run $RUN_ID ..."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Rerun triggered."
