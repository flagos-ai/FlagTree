name: Ascend3.5-910C-Gems-Baseline

on:
  push:
    branches: ["triton_v3.5.x"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Group by commit SHA for push events to allow parallel runs from different merges.
  # Fall back to run_id for other events (e.g., schedule) to ensure each run is independent.
  group: ${{ github.workflow }}-${{
    github.event_name == 'push' && github.event.head_commit.id ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  ascend35x-910c:
    if: ${{ github.event_name == 'push' }}
    uses: flagos-ai/FlagTree/.github/workflows/template-gems-baseline.yml@main
    with:
      runner: ascend3.5-910c
      backend: ascend
      gpu-env-var: ASCEND_RT_VISIBLE_DEVICES
      flaggems-tag: 'v5.3.5'
      flagtree-build-command: |-
        set -x
        export FLAGTREE_BACKEND=ascend
        source ~/env.sh
        export PATH=~/.flagtree/ascend/llvm-7d5de303-ubuntu-aarch64-python311-compat/bin/:${PATH}
        MAX_JOBS=32 python3 -m pip install . --no-build-isolation -v
      flaggems-pre-command: |-
        source /usr/local/Ascend/ascend-toolkit/set_env.sh
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
