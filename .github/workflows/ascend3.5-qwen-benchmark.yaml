name: Ascend3.5-Qwen-Benchmark

on:
  push:
    branches: [ "triton_v3.5.x" ]
  pull_request:
    branches: [ "triton_v3.5.x" ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ascend35x-qwen:
    runs-on: ascend3.5-qwen
    if: ${{ github.repository == 'FlagTree/flagtree' || github.repository == 'flagos-ai/flagtree' }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: ascend

      - name: Cleanup FlagTree Environment
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        uses: flagos-ai/FlagTree/.github/actions/cleanup-flagtree-env@main

      - name: Build FlagTree
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          set -x
          export FLAGTREE_BACKEND=ascend
          source ~/env.sh
          export PATH=~/.flagtree/ascend/llvm-7d5de303-ubuntu-aarch64-python311-compat/bin/:${PATH}  # clang
          export TRITON_APPEND_CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release"

      - name: Clear cache if ClearCache label present
        if: steps.check_backend.outputs.should_skip != 'true'
        id: clear_cache
        uses: flagos-ai/FlagTree/.github/actions/clear-cache-if-labeled@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          backend: ascend-qwen

      - name: Start the service
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          export BENCH_SCRIPT_DIR="${PWD}/.github/workflows/benchmark/ascend3.5-qwen3.6"
          env | grep -E '^(BENCH_SCRIPT_DIR)=' >> $GITHUB_ENV || true
          cd ~/flagrelease
          bash ${BENCH_SCRIPT_DIR}/start.sh

      - name: Show the baseline
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          cd ~/flagrelease
          cat ${BENCH_SCRIPT_DIR}/ref.txt

      - name: Run the benchmark
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          set -x
          cd ~/flagrelease
          bash ${BENCH_SCRIPT_DIR}/perf.sh

      - name: Stop the service
        if: ${{ steps.check_backend.outputs.should_skip != 'true' }}
        shell: bash
        run: |
          cd ~/flagrelease
          bash ${BENCH_SCRIPT_DIR}/stop.sh
