variables:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_TRUSTED_HOST: mirrors.aliyun.com
  PIP_NO_SSL_VERIFY: "1"
  PYTHONHTTPSVERIFY: "0"
  REQUESTS_CA_BUNDLE: ""
  CURL_CA_BUNDLE: ""
  CMAKE_TLS_VERIFY: 0


include:
  - project: 'ai/gitlab-ci-templates'
    file: 'gitlab-review.yml'
  - project: 'ai/gitlab-ci-templates'
    file: 'x86-host-env.yml'


stages:
  - build
  - test


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes: &lint_paths
        - .gitlab-ci.yml
        - .pre-commit-config.yaml
        - .clang-format
        - CMakePresets.json
        - CMakeLists.txt
        - cmake/**/*
        - scripts/**/*
        - include/**/*
        - lib/**/*
        - python/**/*
        - test/**/*
        - runtime/**/*
        - tools/**/*
        - unittest/**/*
        - backend/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *lint_paths
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"


lint:
  stage: .pre
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - 92_13_host
  cache:
    - key:
        files:
          - .pre-commit-config.yaml
      paths:
        - ~/.cache/pre-commit
    - key:
        files:
          - .pre-commit-config.yaml
      paths:
        - ~/.cache/pip
  script:
    - python -m pre_commit run --all-files --show-diff-on-failure --color always


build-spine-mlir:
  extends: .x86-host-ci-env
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_12_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    MAX_JOBS: "16"
  script:
    - |
      set -e
      git submodule update --init --recursive third_party/spine-mlir
      cd third_party/spine-mlir
      LLVM_COMMIT_ID="$(tr -d '[:space:]' < LLVM_VERSION)"
      LLVM_INSTALL_PATH=/home/share/nfs_share/llvm-pre-build/llvm-${LLVM_COMMIT_ID}-release-x86
      echo "LLVM_INSTALL_PATH: ${LLVM_INSTALL_PATH}"
      cmake --preset release \
        -DCMAKE_MAKE_PROGRAM="ninja" \
        -DLLVM_INSTALL_PATH="${LLVM_INSTALL_PATH}"
      cmake --build --preset release --target install -j${MAX_JOBS}
      # spine-mlir main 不再 install LLVM tools，手动从 LLVM 补上供 triton setup.py 使用
      cp "${LLVM_INSTALL_PATH}/bin/llc" build/release/bin/llc
      cp "${LLVM_INSTALL_PATH}/bin/mlir-translate" build/release/bin/mlir-translate
      cp "${LLVM_INSTALL_PATH}/bin/opt" build/release/bin/opt
  artifacts:
    name: spine-mlir-x86-$CI_COMMIT_SHORT_SHA
    paths:
      - third_party/spine-mlir/build/release/
    expire_in: 7 days


build-rpc-runtime:
  extends: .x86-host-ci-env
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_12_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CROSS_TOOLCHAIN_PATH: $DEFAULT_RISCV_ROOT_PATH
  before_script:
    - export GIT_CONFIG_GLOBAL="${CI_PROJECT_DIR}/.job-gitconfig"
    - git config --global http.sslVerify false
    - git config --global url."git@gitlab.dc.com:".insteadOf "https://gitlab.dc.com:8443/"
    - git submodule update --init --recursive third_party/spine-triton-rpc-runtime
    - git submodule update --init --recursive third_party/spine-runtime
  script:
    - |
      set -e
      cd third_party/spine-triton-rpc-runtime
      bash scripts/build_riscv64.sh
      echo "spine-rpc-server built:"
      file build/riscv64/spine-rpc-server

      # Produce a standalone spine-runtime install (libspert.so + spert headers)
      # for the spine-triton wheel build. spine-runtime is a direct submodule of
      # spine-triton (third_party/spine-runtime), not nested under rpc-runtime.
      cd "${CI_PROJECT_DIR}/third_party/spine-runtime"
      RISCV_ROOT_PATH="${CROSS_TOOLCHAIN_PATH}" bash scripts/build.sh riscv64 Release
      echo "spine-runtime installed:"
      ls -la build/riscv64/Release/installed/lib build/riscv64/Release/installed/include

      # Stage outputs OUTSIDE submodule working dirs: GitLab's artifact archiver
      # skips files inside git submodule directories, so artifacting
      # third_party/*/... uploads nothing. Copy to a plain project-dir path.
      cd "${CI_PROJECT_DIR}"
      rm -rf ci-artifacts && mkdir -p ci-artifacts
      cp -a third_party/spine-triton-rpc-runtime/build/riscv64 ci-artifacts/rpc-server-riscv64
      cp -a third_party/spine-runtime/build/riscv64/Release/installed ci-artifacts/spine-runtime-install
      echo "staged artifacts:"
      ls -la ci-artifacts/spine-runtime-install/lib ci-artifacts/spine-runtime-install/include
  artifacts:
    name: rpc-runtime-riscv64-$CI_COMMIT_SHORT_SHA
    paths:
      - ci-artifacts/
    expire_in: 7 days


build-x86:
  extends: .x86-host-ci-env
  stage: build
  needs:
    - job: lint
      optional: true
    - job: build-spine-mlir
      artifacts: true
    - job: build-rpc-runtime
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_12_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    MAX_JOBS: "16"
    TRITON_PARALLEL_LINK_JOBS: "2"
  before_script:
    - git submodule update --init --recursive triton
    - python3 -m pip install --quiet --break-system-packages cmake ninja pybind11 setuptools wheel
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      set -e
      export PATH="$HOME/.local/bin:$PATH"

      LLVM_COMMIT_ID="$(tr -d '[:space:]' < LLVM_VERSION)"
      LLVM_DIR=/home/share/nfs_share/llvm-pre-build/llvm-${LLVM_COMMIT_ID}-20260529-release-x86
      echo "LLVM_DIR: $LLVM_DIR"

      SPEIR_DIR="${CI_PROJECT_DIR}/third_party/spine-mlir/build/release"
      if [ ! -d "$SPEIR_DIR" ]; then
        echo "ERROR: spine-mlir artifact not found at ${SPEIR_DIR}"
        exit 1
      fi
      echo "SPEIR_DIR: $SPEIR_DIR"
      chmod -R a+x $SPEIR_DIR/bin/* || true

      # spine-runtime install (libspert.so + spert headers) from build-rpc-runtime artifact
      SPINE_RUNTIME_DIR="${CI_PROJECT_DIR}/ci-artifacts/spine-runtime-install"
      if [ ! -f "$SPINE_RUNTIME_DIR/include/spert.hpp" ]; then
        echo "ERROR: spine-runtime install not found at ${SPINE_RUNTIME_DIR}"
        exit 1
      fi
      echo "SPINE_RUNTIME_DIR: $SPINE_RUNTIME_DIR"

      chmod +x scripts/build_x86_rpc.sh
      ./scripts/build_x86_rpc.sh $LLVM_DIR $SPEIR_DIR $SPINE_RUNTIME_DIR

      if [ -d "build-x86_64" ]; then
        echo "X86 build successful"
        DEST=/home/share/nfs_share/ci-builds/ai/AICompiler/spine-triton/$CI_PIPELINE_ID
        mkdir -p $DEST
        cp -a build-x86_64 $DEST/
        cp -a python/examples $DEST/
        echo "spine-triton build released to $DEST"
      else
        echo "X86 build failed, build-x86_64 directory not found"
        exit 1
      fi
  artifacts:
    name: spine-triton-x86-$CI_COMMIT_SHORT_SHA
    paths:
      - build-x86_64/
    expire_in: 7 days



test-spine-triton-integration:
  extends: .x86-host-ci-env
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  needs:
    - job: build-x86
      artifacts: false
    - job: build-rpc-runtime
      artifacts: true
  tags:
    - 92_12_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CROSS_TOOLCHAIN_PATH: $DEFAULT_RISCV_ROOT_PATH
    QEMU_PATH: /home/share/nfs_share/ci-node-compiler-env/jdsk-qemu-static-0.0.9_s2/qemu-riscv64-static
    QEMU_SYSROOT: /home/share/nfs_share/ci-node-compiler-env/spacemit-toolchain-linux-glibc-x86_64-v1.2.4/sysroot
    RPC_PORT: "9999"
  script:
    - |
      set -e

      ST_BASE=/home/share/nfs_share/ci-builds/ai/AICompiler/spine-triton
      ST_DIR=$(for d in $(ls -d ${ST_BASE}/[0-9]* 2>/dev/null | sort -t/ -k8 -n -r); do
                 [ -d "$d/build-x86_64" ] && echo "$d" && break
               done)
      if [ -z "$ST_DIR" ]; then
        echo "ERROR: no spine-triton build (with build-x86_64/) found in ${ST_BASE}"
        exit 1
      fi
      echo "spine-triton build dir: $ST_DIR"

      RPC_DIR="${CI_PROJECT_DIR}/ci-artifacts/rpc-server-riscv64"
      if [ ! -f "$RPC_DIR/spine-rpc-server" ]; then
        echo "ERROR: spine-rpc-server not found at ${RPC_DIR}/spine-rpc-server"
        exit 1
      fi
      echo "rpc-runtime build dir: $RPC_DIR"

      source /home/gitlab-runner/.triton/bin/activate

      export PYTHONPATH=$ST_DIR/build-x86_64:$PYTHONPATH
      export SPINE_TRITON_CROSS_TOOLCHAIN=$CROSS_TOOLCHAIN_PATH
      export SPINE_TRITON_TARGET_ARCH=riscv64
      export SPACEMIT_EP_QEMU_SET_CORE_ARCH="0xA064"
      export SPINE_TRITON_RPC_HOST=localhost
      export SPINE_TRITON_RPC_PORT=$RPC_PORT
      export SPINE_TRITON_DUMP_PATH=$CI_PROJECT_DIR/rpc_ir_dump
      export GEMS_VENDOR=spacemit
      mkdir -p $SPINE_TRITON_DUMP_PATH

      # 启动前清理可能残留的旧 QEMU server (上次 job 异常中断未清理)
      pkill -f "spine-rpc-server $RPC_PORT" 2>/dev/null || true
      for i in $(seq 1 10); do
        python3 -c "import socket,sys; s=socket.socket(); sys.exit(1 if s.connect_ex(('localhost', $RPC_PORT))==0 else 0)" && break
        echo "waiting for stale server on port $RPC_PORT to exit..."
        sleep 1
      done

      # 启动 QEMU RPC server
      "$QEMU_PATH" \
        -L "$QEMU_SYSROOT" \
        -cpu max,vlen=1024,elen=64,vext_spec=v1.0\
        "$RPC_DIR/spine-rpc-server" "$RPC_PORT" > rpc_server.log 2>&1 &
      echo $! > .rpc_server.pid

      # 等待本次启动的 server 就绪 (确认 PID 存活, 而非连到旧 server)
      SERVER_PID=$(cat .rpc_server.pid)
      for i in $(seq 1 30); do
        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "RPC server process died, log:"; cat rpc_server.log; exit 1
        fi
        if python3 -c "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex(('localhost', $RPC_PORT))==0 else 1)"; then
          echo "RPC server is ready"; break
        fi
        if [ "$i" = "30" ]; then echo "RPC server failed to start"; cat rpc_server.log; exit 1; fi
        sleep 1
      done

      # spine-triton e2e 集成测试
      # python3 $ST_DIR/examples/mm_block_ptr.py

      # spine-FlagGems 算子测试
      rm -rf "$CI_PROJECT_DIR/flaggems"
      git clone --depth=1 -b spacemit-ops-v2.2 https://gitlab.dc.com:8443/ai/AICompiler/spine-flaggems.git "$CI_PROJECT_DIR/flaggems"
      export PYTHONPATH=$CI_PROJECT_DIR/flaggems/src:$PYTHONPATH
      mkdir -p "$CI_PROJECT_DIR/flaggems/logs"
      cd "$CI_PROJECT_DIR/flaggems"
      PYTHONUNBUFFERED=1 timeout 1200 stdbuf -oL -eL \
        pytest -sv tests/test_unary_pointwise_ops.py -m gelu
      # pytest -sv tests/test_blas_ops.py --ref=cpu &> logs/blas.log || true
  after_script:
    - '[ -f rpc_server.log ] && echo "=== RPC server log ===" && cat rpc_server.log || true'
    - |
      if [ -f .rpc_server.pid ]; then
        SERVER_PID=$(cat .rpc_server.pid)
        kill "$SERVER_PID" 2>/dev/null || true
        rm -f .rpc_server.pid
      fi
      # 兜底: 杀掉任何还占着该端口的 server, 避免污染下次 job
      pkill -f "spine-rpc-server $RPC_PORT" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - flaggems/logs/
      - rpc_server.log
    expire_in: 7 days
