# FlagTree backends that packaging/ can build a distribution package for.
#
# Single source of truth for the per-backend facts the packaging needs. Adding
# a backend is a row here plus a build row in .github/workflows/build-deb.yml;
# nothing else in packaging/ mentions a backend by name.
#
# Pipe-separated columns, "#" starts a comment, blank lines are ignored:
#
#   backend   FLAGTREE_BACKEND, and the package-name suffix:
#             python3-flagtree-<backend>
#   arch      Debian architecture of the produced package
#   wheel     where the wheel to package comes from:
#               source  compiled from this tree by Dockerfile.deb's
#                       wheel-builder stage (~36 min, needs LLVM/CMake/Ninja)
#               index   downloaded from the FlagOS Python index, where the
#                       backend's own <backend>N.N-delivery.yml workflow
#                       publishes it; no vendor SDK or vendor machine needed
#   base      default base image for both build stages
#   python    interpreter to build with; empty = the base image's python3.
#             Must be the CPython minor the published wheel is tagged for --
#             fetch-wheel.sh only accepts a wheel whose cp tag matches.
#   vendor    vendor name as it appears in the package Description
#   excludes  space-separated path fragments to keep away from dpkg-shlibdeps,
#             for wheels bundling vendor .so files the build host cannot
#             resolve (see SHLIBDEPS_EXCLUDE in debian/rules)
#   runtime   the Description's closing "Requires <runtime>." sentence
#   smoke     how far the build's smoke test goes, empty = import:
#               import   install the .deb and import triton
#               install  install the .deb only. triton imports every installed
#                        backend's compiler module, so a backend reaching for
#                        its vendor SDK there cannot be imported on a build
#                        host without that SDK
#
#backend|arch|wheel|base|python|vendor|excludes|runtime|smoke
nvidia|amd64|source|ubuntu:24.04||NVIDIA||the CUDA runtime to execute kernels on NVIDIA GPUs
metax|amd64|index|ubuntu:24.04||MetaX||the MetaX MACA runtime to execute kernels on MetaX GPUs
amd|amd64|index|ubuntu:24.04||AMD||the ROCm runtime to execute kernels on AMD GPUs
enflame|amd64|index|ubuntu:24.04||Enflame||the Enflame driver and runtime libraries to execute kernels on Enflame accelerators|install
ppu|amd64|index|ubuntu:24.04||T-Head||the T-Head PPU SDK to execute kernels on T-Head accelerators
tileir|amd64|index|ubuntu:24.04||NVIDIA TileIR||the CUDA runtime to execute kernels on NVIDIA GPUs through TileIR
hcu|amd64|index|ubuntu:22.04||HYGON||the HYGON driver and runtime libraries to execute kernels on HYGON accelerators
mthreads|amd64|index|ubuntu:22.04||Moore Threads||the Moore Threads driver and runtime libraries to execute kernels on Moore Threads GPUs
tsingmicro|amd64|index|ubuntu:22.04||Tsingmicro||the Tsingmicro driver and runtime libraries to execute kernels on Tsingmicro accelerators|install
xpu|amd64|index|ubuntu:22.04||KLX|triton/backends/xpu|the KLX driver and runtime libraries to execute kernels on KLX accelerators
